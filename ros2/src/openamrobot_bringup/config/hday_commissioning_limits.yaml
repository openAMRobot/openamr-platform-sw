# H-day (16 Nov 2026) commissioning limits for the release 001 rig, Nav2 and the velocity
# smoother. Merged over openamrobot_nav2/config/nav2_params.yaml by hday_legacy.launch.py.
#
# 0.20 m/s and 1.0 rad/s are a COMMISSIONING limit for this rig only. The product speed
# ceiling stays 0.5 m/s (P-03 rev20.6); nothing here changes nav2_params.yaml or that ceiling.
# Only keys that differ from nav2_params.yaml are listed. Reverse limits stay as on main.
controller_server:
  ros__parameters:
    FollowPath:
      max_vel_x: 0.20
      max_speed_xy: 0.20
      max_vel_theta: 1.0

velocity_smoother:
  ros__parameters:
    max_velocity: [0.20, 0.0, 1.0]
    min_velocity: [-0.20, 0.0, -1.0]
