# legacy_v001 profile: Nav2 parameter overrides for the v0.0.1 (release 001, Gate A) platform.
#
# Merged on top of openamrobot_nav2/config/nav2_params.yaml by legacy_v001.launch.py into a
# temporary file. nav2_params.yaml itself is not modified, so the default profiles do not change.
#
# Speed: P-03 item 30 A5 keeps the base speed ceiling at 0.5 m/s. The first floor run on the
# v0.0.1 platform uses a commissioning limit of 0.20 m/s (roadmap rev 2, L-G5). The Teensy
# firmware has no speed clamp of its own (it saturates near 0.71 m/s, see
# docs/legacy-16nov/compatibility.md), so these values are the only software speed limit on
# this platform. They are pinned here so that a later change to nav2_params.yaml cannot raise
# the speed of this profile by accident; test_legacy_v001_profile.py checks them.
controller_server:
  ros__parameters:
    FollowPath:
      max_vel_x: 0.20
      max_speed_xy: 0.20
      max_vel_theta: 0.5
      rotate_to_heading_angular_vel: 0.5

velocity_smoother:
  ros__parameters:
    max_velocity: [0.20, 0.0, 0.5]
    min_velocity: [-0.20, 0.0, -0.5]

amcl:
  ros__parameters:
    # The robot is not at the map origin at start: the operator sets the pose (2D Pose Estimate).
    set_initial_pose: false
