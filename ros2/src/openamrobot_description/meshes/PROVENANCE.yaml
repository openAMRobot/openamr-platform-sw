      - part: cover
        clearance_mm: 1.3
        axis: x
      - part: cover_flange_rear
        clearance_mm: 2.04
        axis: x
      - part: support_rear_left
        clearance_mm: 23.3
        axis: y
      - part: support_rear_right
        clearance_mm: 23.3
        axis: y
