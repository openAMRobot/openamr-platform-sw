        clearance_mm: 2.04
        axis: x
        verdict: ok
      - subject: rear supports
        clearance_mm: 23.3
        axis: y
        verdict: ok
      - subject: centre bracket (front)
        clearance_mm: 1.25
        axis: x
        verdict: under 2 mm
      - subject: rear panel and its mounts
        clearance_mm: 42.75
        axis: x
        verdict: ok
      - subject: base plate (above the deck top)
        clearance_mm: 40.35
        axis: x
        verdict: ok
      - subject: rear castor mounts
        clearance_mm: 39.55
        axis: y
        verdict: ok
      - subject: rear ultrasonic sensors
