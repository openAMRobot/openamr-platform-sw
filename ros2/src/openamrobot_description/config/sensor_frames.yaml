# OpenAMRobot 2.0 base sensor frames (#49).
# Parent base_link (REP 105: drive-axle midpoint, 0.098 m above the floor), x forward,
# y left, z up. xyz in metres, rpy in radians. The URDF values are in
# urdf/sensors.xacro; keep both files in step.
#
# CAD source: CAD Rev B full assembly STEP MMP.00.00.00.000 (2026-10-13,
# openamr-platform-hw). STEP axes: X forward, Y up from the floor, Z right;
# base_link = (X, -Z, Y - 98 mm). Range sensor frames are at the centre of the sensor
# face with x along the beam.
#
# status: measured    = taken from the CAD Rev B assembly
#         placeholder = not in the CAD Rev B assembly, still the earlier decision value
#         decision    = fixed by a recorded decision, not by the CAD

frames:
  base_camera_link:
    sensor: Orbbec Gemini 336L
    xyz: [0.386, 0.0, 0.0447]
    rpy: [0.0, -0.1745, 0.0]   # default bt10, 10 deg up; base_tilt: bt00 0, bt05 -0.0873, bt10 -0.1745, bt15 -0.2618
    cad_source: GEMINI_336L_3D_ALL_ASM model origin on camera mount MMP.01.00.00.003, 10 deg up in the assembly
    status: measured
    superseded: "(0.376, 0, 0.0445) (Alex decision 2026-10-12)"

  imu_link:
    sensor: ICM-42688-P
    xyz: [0.195, 0.0, -0.044]
    rpy: [0.0, 0.0, 0.0]
    cad_source: none, the IMU and its mounting plate are not designed yet (CAD v0.2 open item)
    status: placeholder

  lidar_link:
    sensor: RPLIDAR S3
    xyz: [0.330, 0.0, 0.124]
    rpy: [0.0, 0.0, 3.141592653589793]
    cad_source: S3_CONTINUE_ASM centre at x 0.321, body 0.1937 to 0.235 m above the floor
    status: decision   # issue #49 keeps lidar_link; CAD Rev B centre is 9 mm further back
    mount: 20 mm printed spacer MMP.07.00.00.002, S3 base 0.194 m above the floor
    note: scan plane 0.222 m above the floor (Alex decision 2026-10-12)

  tof_front_left:
    sensor: Benewake TF-Luna
    xyz: [0.3945, 0.130, -0.0074]
    rpy: [0.0, 0.1745, 0.0]   # 10 deg down
    cad_source: BeneWake TF-LUNA lens face centre; pitch from the 10 deg face of TF-Luna mount MMP.00.00.00.005
    status: measured
  tof_front_right:
    sensor: Benewake TF-Luna
    xyz: [0.3945, -0.130, -0.0074]
    rpy: [0.0, 0.1745, 0.0]   # 10 deg down
    cad_source: BeneWake TF-LUNA lens face centre; pitch from the 10 deg face of TF-Luna mount MMP.00.00.00.005
    status: measured
  tof_rear_left:
    sensor: Benewake TF-Luna
    xyz: [-0.3933, 0.130, -0.0074]
    rpy: [0.0, 0.1745, 3.141592653589793]   # 10 deg down
    cad_source: BeneWake TF-LUNA lens face centre; pitch from the 10 deg face of TF-Luna mount MMP.00.00.00.005
    status: measured
  tof_rear_right:
    sensor: Benewake TF-Luna
    xyz: [-0.3933, -0.130, -0.0074]
    rpy: [0.0, 0.1745, 3.141592653589793]   # 10 deg down
    cad_source: BeneWake TF-LUNA lens face centre; pitch from the 10 deg face of TF-Luna mount MMP.00.00.00.005
    status: measured

  us_front:
    sensor: MaxBotix MB7060
    xyz: [0.394, 0.0, -0.0066]
    rpy: [0.0, 0.0, 0.0]
    cad_source: HRXL-MaxSonar-WR face; height from the front panel hole centre (0.0914 m)
    status: measured
  us_rear:
    sensor: MaxBotix MB7060
    xyz: [-0.391, 0.0, -0.0066]
    rpy: [0.0, 0.0, 3.141592653589793]
    cad_source: HRXL-MaxSonar-WR face; height from the back panel hole centre (0.09135 m)
    status: measured

superseded_frames:
  # Alex decision 2026-10-12, replaced by the CAD Rev B layout (4 ToF, 2 ultrasonic).
  - us_front_left
  - us_front_right
  - us_rear_left
  - us_rear_right
  - tof_front
  - tof_rear
