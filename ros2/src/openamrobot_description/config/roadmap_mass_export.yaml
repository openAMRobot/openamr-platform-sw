schema_version: 1
about: 'Roadmap model masses per URDF link, generated by scripts/roadmap_model/mass_export.py from bom_coverage.csv (BOM Issue 7.14 masses), placement.json and the
  analysis roll-up. Input for the platform-sw mass PR (base) and for mass_provenance.yaml (upper body). Frame of com_m in links: the link frame (identity rotations);
  components: base_footprint at bp000.'
snapshot: 8 Nov 2026
