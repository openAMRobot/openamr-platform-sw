# SPDX-License-Identifier: MIT
# Station-relative final alignment (Proposed, 17 Nov 2026). docs/architecture/station_alignment.md.
# Station: Build 1 work shelf. Every value is a simulation working value, not a site or robot value.
station_marker_detector:
  ros__parameters:
    base_frame: base_footprint
    detections_topic: /apriltag/detections
    station_pose_topic: /station_alignment/station_pose
    # Marker plate: 36h11 ids 3 and 4 (0 to 2 are the charging dock's), centres 0.10 m either side of the plate
    # origin along the shelf axis; the station is 0.713 m in front of the plate face (parking gap 0.30 m + footprint
    # front 0.415 m - plate 0.002 m in front of the shelf edge), facing the shelf. scene.py derives the same numbers;
    # test/test_scene.py checks that they agree.
    tag_ids: [3, 4]
    tag_frames: [station_marker_3, station_marker_4]
    tag_offsets: [-0.10, 0.10]
    standoff: 0.713
    lateral: 0.0
    # Both tags: the shelf axis comes from the 0.20 m baseline between them. One tag alone gives its face normal,
    # whose yaw is ambiguous in a near-frontal view (PnP flip); min_tags 1 would publish it with a larger yaw floor.
    min_tags: 2
    window: 10
    gate_xy: 0.02
    gate_yaw: 0.04
    floor_xy: 0.003
    floor_yaw: 0.005
    single_tag_floor_yaw: 0.03

station_alignment:
  ros__parameters:
    navigate_action: navigate_to_pose
    action_name: /station_alignment/navigate_to_station
    station_pose_topic: /station_alignment/station_pose
    report_topic: /station_alignment/report
    global_frame: map
    base_frame: base_footprint
    settle_s: 1.0
    samples: 8
    # Fewer once sample_timeout_s has passed: at least min_samples (low frame rates over Fast DDS).
    min_samples: 4
    # Sample window, simulation time (sampling.py): `samples` station poses stamped after the robot settled. Not
    # seen: nothing at all in sample_timeout_s. Stale stamps (the camera to pose pipeline lags; more than 6 s of
    # simulation time at a real-time factor of 0.2 in Baseline 1): wait up to sample_timeout_s + max_latency_s.
    sample_timeout_s: 6.0
    max_latency_s: 15.0
    # No usable marker after the #164 approach: succeed_unaligned (SUCCEEDED, error_code 9900, outcome
    # "not aligned: ...", the base stays where #164 stopped it) or abort.
    on_marker_not_seen: succeed_unaligned
    max_iterations: 3
    # Acceptance per axis of the measured residual (the station in the robot frame). Not below station_goal_checker
    # (platform-sw #164, 0.025 m, 0.05 rad) plus the marker error, because a smaller correction would not move the
    # robot: the goal checker accepts it at once. Worst accepted pose: hypot(0.03, 0.02) = 0.036 m and 0.06 rad,
    # inside the 0.04 m / 0.08 rad reach budget. A lateral residual up to accept_lateral is not driven (a
    # differential base cannot step sideways); a larger one through a short reverse (below).
    accept_along: 0.03
    accept_lateral: 0.02
    accept_yaw: 0.06
    # Corrections (Proposed, 18 Nov 2026, maneuver.py): position target fixed in odom at the measurement, reached
    # with behavior_server's BackUp and DriveOnHeading (odom, no progress checker); heading target in map, reached
    # with rotation-only goals of #164's station tree (closed on the AMCL heading; behavior_server's Spin stops on
    # odometry, which missed about half of the turn in simulation). Not a map-frame position goal, which AMCL updates
    # moved, and not a reverse through StationApproach, which cannot reverse. Lateral residual > accept_lateral:
    # back up `backoff`, turn to the target point, drive, turn to the target yaw.
    backoff: 0.15
    odom_frame: odom
    behavior_speed: 0.05
    behavior_time_allowance_s: 30.0
    spin_action: spin
    backup_action: backup
    drive_on_heading_action: drive_on_heading
    # A marker that says the robot is further off than AMCL ever was at the station is not trusted: abort.
    max_correction_xy: 0.15
    max_correction_yaw: 0.30
    max_sample_spread_xy: 0.01
    navigation_timeout_s: 300.0
