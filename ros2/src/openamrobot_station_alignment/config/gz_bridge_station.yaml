# SPDX-License-Identifier: MIT
# ros_gz_bridge entries of the station alignment simulation. The base entries are those of
# openamrobot_gazebo/config/gz_bridge.yaml (clock, /odom, /tf, /cmd_vel, /scan); the test-only base camera and the
# ground truth are added. Simulation only.
- {ros_topic_name: "clock", gz_topic_name: "clock", ros_type_name: "rosgraph_msgs/msg/Clock", gz_type_name: "gz.msgs.Clock", direction: GZ_TO_ROS}
- {ros_topic_name: "/odom", gz_topic_name: "/odom", ros_type_name: "nav_msgs/msg/Odometry", gz_type_name: "gz.msgs.Odometry", direction: GZ_TO_ROS}
- {ros_topic_name: "/tf", gz_topic_name: "/tf", ros_type_name: "tf2_msgs/msg/TFMessage", gz_type_name: "gz.msgs.Pose_V", direction: GZ_TO_ROS}
- {ros_topic_name: "/cmd_vel", gz_topic_name: "/cmd_vel", ros_type_name: "geometry_msgs/msg/Twist", gz_type_name: "gz.msgs.Twist", direction: ROS_TO_GZ}
- {ros_topic_name: "/scan", gz_topic_name: "/scan", ros_type_name: "sensor_msgs/msg/LaserScan", gz_type_name: "gz.msgs.LaserScan", direction: GZ_TO_ROS}
- {ros_topic_name: "/base_camera/color/image_raw", gz_topic_name: "/base_camera/color/image_raw", ros_type_name: "sensor_msgs/msg/Image", gz_type_name: "gz.msgs.Image", direction: GZ_TO_ROS}
- {ros_topic_name: "/base_camera/color/camera_info", gz_topic_name: "/base_camera/color/camera_info", ros_type_name: "sensor_msgs/msg/CameraInfo", gz_type_name: "gz.msgs.CameraInfo", direction: GZ_TO_ROS}
- {ros_topic_name: "/station_alignment/ground_truth/odom", gz_topic_name: "/station_alignment/gz/ground_truth_odom", ros_type_name: "nav_msgs/msg/Odometry", gz_type_name: "gz.msgs.Odometry", direction: GZ_TO_ROS}
