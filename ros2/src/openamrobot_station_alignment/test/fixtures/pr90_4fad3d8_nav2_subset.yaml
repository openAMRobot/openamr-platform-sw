# The reverse-related values of platform-sw #90 (head 4fad3d8bfd40954bc8fcf6f0adf603561e6bb530,
# ros2/src/openamrobot_nav2/config/nav2_params.yaml), copied unchanged for the station alignment tests. #90 is not
# merged; the simulation workflow reads the same keys from #90's own file at that commit.
controller_server:
  ros__parameters:
    FollowPath:
      min_vel_x: 0.0
behavior_server:
  ros__parameters:
    behavior_plugins: ["spin", "wait"]
velocity_smoother:
  ros__parameters:
    min_velocity: [0.0, 0.0, -0.5]
