# Declared site/map identity and required/optional zone list, read by
# navigation_status_node to produce NavigationStatus.site_config
# (interfaces#27 / platform-sw#36).

site_id: "sim"

map_id: "sim-floor-1"
# SHA-256 over the loaded map's resolution/origin/size/cell-data, the same
# way navigation_status_node hashes the live /map topic (see
# NavigationStatusNode._map_identity_hash). Generate this value with:
#   python3 tools/compute_map_identity.py path/to/map.yaml --write \
#     ros2/src/openamrobot_nav2/config/site_config.yaml
# A blank value here (the shipped placeholder) correctly and harmlessly
# reports MISMATCHED rather than silently claiming a match it hasn't
# verified - run the tool above once a real map.yaml exists for this site.
map_version: "b92f32a9e5bd60c11b9d259a118484d624f63a7febcaa36a7fa3d6ec3424437c"

config_id: "sim-floor-1-config"
# OPEN ITEM: there is no separate approval/fleet-manifest source yet to
# compare this file against (tracked as a follow-up on interfaces#27), so the
# node can only require that an operator actually filled this in - see
# _site_config_status()'s docstring. A blank value here (the shipped
# placeholder) correctly reports CONFIG_ID_MISMATCH and blocks readiness,
# the same way a blank map_version does, rather than silently passing.
config_version: "sim-v1"

# OPEN ITEM: not yet checked against a live costmap/geofence layer (tracked
# as a follow-up on interfaces#27, same as the map-identity tool above) - see
# _site_config_status()'s docstring. A non-empty list here can not actually
# be confirmed present yet, so it reports FLOOR_COVERAGE_INSUFFICIENT
# (required) or _OPTIONAL_GAP (optional) and degrades/blocks readiness
# accordingly, rather than silently passing. Leave a list empty if its zones
# are not meant to affect readiness until the real check lands.
required_zones: []

optional_zones: []
