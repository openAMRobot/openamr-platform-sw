amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0   # = portee reelle du RPLIDAR A1, legacy (existing robot) (100 inutile -> faisceaux fantomes)
    # RPLIDAR S3 (OpenAMRobot 2.0): 12.0 kept until retuned from the Slamtec S3 datasheet.
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    # AMCL kidnap-recovery: when the short-term average particle weight
    # (fast) drops well below the long-term average (slow), AMCL injects
    # uniformly distributed particles to relocalise. Previously both were
    # 0.0 (recovery disabled), so the robot would silently keep believing
    # its initial pose after any unexpected teleport (Gazebo drag-and-drop,
    # wheel slip, bump). These values are the standard Nav2 recommendation
    # and let AMCL recover in 1–2 s after a teleport.
    recovery_alpha_fast: 0.1
    recovery_alpha_slow: 0.001
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    # 0.25 m / 0.2 rad -> 0.05 m / 0.05 rad (Proposed, 17 Nov 2026, station approach). With 0.25 / 0.2 AMCL updated 16
    # times in a 130 s Baseline 1 mission and not during the last 0.3 m of the station approach; at the station its map
    # pose was 0.035 to 0.050 m from ground truth (runs 44100053272, 44100120091), against the 0.015 m the station
    # tolerance leaves to localization. More filter updates cost CPU on the robot computer: owner to confirm.
    update_min_a: 0.05
    update_min_d: 0.05
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: /scan_filtered
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # 1000 -> 30000 ms (Alex, 17 Nov 2026; platform-sw #165, OpenRAL review audits #88): how long each BT action node
    # waits for its server when a tree is loaded. OpenRAL measured that 1000 ms aborts Nav2 on a loaded machine;
    # hosted CI runners run Gazebo at a real-time factor of 0.13 to 0.25.
    wait_for_service_timeout: 30000
    action_server_result_timeout: 900.0
    # The stock Nav2 1.3.14 trees with goal_checker_id="general_goal_checker" on FollowPath (behavior_trees/), needed
    # because controller_server has two goal checkers. navigate_to_station.xml is chosen per goal (NavigateToPose
    # behavior_tree field) for a manipulation station; it is not a default.
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    # D-19 audit (platform-sw#124, Alex's finding on #90): nav2_bt_navigator's
    # own shipped default BT automatically commands a blind 0.30 m reverse
    # (BackUp) as a controller/planner-failure recovery action - no external
    # client, no docking involved, same LiDAR rear-blind-spot hazard D-19
    # disables dock_trigger's undock reverse for. This is the same tree with
    # only BackUp removed from RecoveryActions; Spin/Wait/clearing stay.
    #
    # MUST be top-level bt_navigator.ros__parameters keys, not nested inside
    # navigate_to_pose:/navigate_through_poses: (panthera-momagdii's #90
    # review, P1): Jazzy's NavigateToPoseNavigator/NavigateThroughPosesNavigator
    # only ever read default_nav_to_pose_bt_xml/default_nav_through_poses_bt_xml
    # at the top level (nav2_bt_navigator/src/navigators/navigate_to_pose.cpp,
    # navigate_through_poses.cpp) - nested here, automatically_declare_
    # parameters_from_overrides(true) still lets them exist as parameters (so
    # a naive parameter-read test can pass), but the navigators themselves
    # never look at them and silently fall back to the stock
    # *_w_replanning_and_recovery.xml trees, which DO contain BackUp.
    default_nav_to_pose_bt_xml: "behavior_trees/navigate_to_pose_no_backup.xml"
    default_nav_through_poses_bt_xml: "behavior_trees/navigate_through_poses_no_backup.xml"
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker", "station_goal_checker"]
    controller_plugins: ["FollowPath", "StationApproach", "StationRetreat"]
    use_realtime_priority: false

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      # 30 -> 12 s: declare 'no progress' and run recoveries sooner instead of
      # sitting stuck for 30 s (a big part of the perceived 'thinking' time,
      # especially when a wheel momentarily stalls (a loose motor cable, or start-up stiction).
      movement_time_allowance: 12.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # COARSE navigation tolerance (Raj review PR4). Docking precision is SEPARATE and much tighter:
      # docking_server.docking_threshold=0.05 + dock_trigger.yaml (scan_centring_tolerance 0.035 rad,
      # spin_yaw_tolerance 0.02 rad, docking_distance 0.15 m). The docking sequencer does NOT use this
      # nav tolerance, so a loose nav goal does not compromise the dock approach.
      xy_goal_tolerance: 0.35
      yaw_goal_tolerance: 0.35
    # Station approach (Proposed, 17 Nov 2026), used only by behavior_trees/navigate_to_station.xml after the coarse
    # navigation above has ended. Derivation (openamr-upperbody-sw docs/integration/station_approach.md): for the Build 1
    # work-shelf grasp the left arm reaches the approach, grasp and lift poses for every base pose error up to 0.04 m and
    # 0.08 rad (inverse kinematics on the expanded URDF, 48 of 48 combinations); at 0.05 m and 0.10 rad it does not.
    # 0.025 m and 0.05 rad leave 0.015 m and 0.03 rad of that budget to localization (AMCL against ground truth).
    # Simulation-derived working values, not a site or robot acceptance tolerance.
    station_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.025
      yaw_goal_tolerance: 0.05
    StationApproach:
      # The control law of the docking approach (nav2_graceful_controller), on a short NavFn path that ends at the goal.
      # Speeds stay within the commissioning limits below (max_vel_x 0.20, max_vel_theta 0.5).
      plugin: "nav2_graceful_controller::GracefulController"
      transform_tolerance: 0.6
      min_lookahead: 0.10
      max_lookahead: 0.40
      k_phi: 2.0
      k_delta: 1.0
      beta: 0.4
      lambda: 2.0
      v_linear_min: 0.03
      v_linear_max: 0.10
      v_angular_max: 0.5
      v_angular_min_in_place: 0.25
      slowdown_radius: 0.25
      initial_rotation: true
      initial_rotation_tolerance: 0.25
      prefer_final_rotation: true
      rotation_scaling_factor: 0.5
      # Forward only (D-19, no reverse path). Stated false: with initial_rotation true the controller would turn
      # true to false itself (nav2_graceful_controller parameter_handler.cpp, jazzy), but the file says what runs.
      allow_backward: false
      in_place_collision_resolution: 0.1
    StationRetreat:
      # PROPOSED (22 Nov 2026, openamr-upperbody-sw #117), awaiting Kunal (Nav2 owner) and the software lead. Used only
      # by behavior_trees/navigate_to_station_retreat.xml (the Baseline 1 forward retreat). StationApproach latches
      # "goal reached" on the path length from the nearest path pose (graceful_controller.cpp 161 to 165), which NavFn's
      # last segment (up to about 0.07 m) puts up to about 0.035 m from the goal, outside station_goal_checker.
      # Regulated Pure Pursuit rotates to the goal heading on the robot-to-carrot distance instead (jazzy
      # regulated_pure_pursuit_controller.cpp 319 to 337; the carrot is the last path pose once the remaining path is
      # shorter than the lookahead). Values copied from StationApproach where a parameter corresponds.
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.10                    # StationApproach v_linear_max
      lookahead_dist: 0.20
      min_lookahead_dist: 0.10                    # StationApproach min_lookahead
      max_lookahead_dist: 0.40                    # StationApproach max_lookahead
      use_velocity_scaled_lookahead_dist: false
      # Kunal's review of #182: StationApproach's own slowdown_radius (0.25 m) was copied
      # verbatim, but the whole retreat move is only forward_m=0.3 m
      # (baseline1_mission_options.json, upperbody#117) - at 0.25 m the robot is inside the
      # scaling zone for essentially the entire path and the documented desired_linear_vel
      # 0.10 m/s is never actually reached for more than an instant. Re-derived for this
      # path length instead of copied: 0.08 m leaves about 0.22 m (roughly 70%) of the 0.3 m
      # move at full speed, with deceleration only over the final stretch comparable to the
      # 0.025 m station_goal_checker's own precision needs. Proposed, not measured in
      # Gazebo - re-check against a real run before adopting.
      approach_velocity_scaling_dist: 0.08
      min_approach_linear_velocity: 0.03          # StationApproach v_linear_min
      use_regulated_linear_velocity_scaling: false
      use_cost_regulated_linear_velocity_scaling: false
      # Forward only (D-19, no reverse path). Stated false; test_baseline1_no_reverse_paths.py lists true.
      allow_reversing: false
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.25           # StationApproach initial_rotation_tolerance
      rotate_to_heading_angular_vel: 0.25         # StationApproach v_angular_min_in_place
      max_angular_accel: 3.0                      # FollowPath
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      transform_tolerance: 0.6                    # StationApproach
      # Kunal's decision on the first StationRetreat ABORT (run 45010425642 leg 1, root-caused
      # against the installed navigation2 1.3.14 source, regulated_pure_pursuit_controller.cpp
      # 330-336): with stateful true, has_reached_xy_tolerance_ latches once and then only
      # rotates (linear_vel 0) regardless of later drift (AMCL re-localizing, rotation-centre
      # slide) pushing the robot back outside station_goal_checker's own 0.025 m circle - the
      # goal checker then never independently sees xy inside tolerance again, and
      # simple_progress_checker.cpp aborts after movement_time_allowance (12.0 s, shared
      # globally with FollowPath/StationApproach - not changed here). stateful false makes RPP
      # re-test xy every cycle (same file, :337) instead of latching, so a small drift drives
      # the base back into the circle (curvature 0 inside 0.0316 m, min speed 0.03 m/s) instead
      # of stalling on a stale decision. Known residual, not fixed by this: if the goal ends up
      # more than 0.25 rad off heading, the required half turn (pi/0.25 = 12.57 s) still exceeds
      # movement_time_allowance - raising that is a separate, global decision affecting every
      # controller's stall-recovery speed, left to the owner.
      stateful: false
    FollowPath:
      # RotationShimController: makes the robot ROTATE toward the path before driving (DWB alone
      # struggles to turn in place to set off in another direction). DWB remains the sub-controller.
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "dwb_core::DWBLocalPlanner"
      angular_dist_threshold: 0.785       # heading error > 45 deg -> turn in place first
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 0.5  # <= max_vel_theta
      max_angular_accel: 3.0              # 0.5->3.0: was below the motor stiction floor at the 0.05s
                                           # control period (0.5*0.05=0.025 rad/s), deadlocking in-place
                                           # rotation entirely — see acc_lim_theta below
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: true
      debug_trajectory_details: True
      # 0.0, was -0.05 (D-19; #90's behaviour set applied to Baseline 1, Proposed 20 Nov 2026): the rear sectors are
      # masked (scan_body_filter), so collision_monitor does not see behind the robot; any reverse here is blind.
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.20          # forward speed (raised 0.12->0.20, the -2.5 braking absorbs the momentum)
      max_vel_y: 0.0
      max_vel_theta: 0.5       # slow/steady rotation (2.0 was far too much)
      min_speed_xy: 0.0
      max_speed_xy: 0.20       # aligned with max_vel_x
      min_speed_theta: 0.0
      acc_lim_x: 1.0            # 0.5->1.0: same stiction-deadlock fix as acc_lim_theta below
      acc_lim_y: 0.0
      acc_lim_theta: 3.0       # 0.5->3.0: 0.5 * 0.05s control period = 0.025 rad/s commanded accel,
                               # under the motor's stiction floor -> in-place rotation never started
                               # (measured deadlock 2026-07-06). 3.0 clears the floor.
      decel_lim_x: -2.5        # stronger braking -0.5->-2.5: slows down much earlier to counter
      decel_lim_y: 0.0         # the heavy robot's inertia (otherwise it overshoots the target)
      decel_lim_theta: -3.0    # -2.0->-3.0: matches the raised acc_lim_theta, stops the rotation in time
      vx_samples: 20
      vy_samples: 1            # differential base, max_vel_y=0 (was 5 — Raj review PR4)
      vtheta_samples: 30       # rotation samples (lowered 40->30: a touch less angular hesitation)
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.6
      xy_goal_tolerance: 0.35
      trans_stopped_velocity: 0.02   # measured odom noise floor (was 0.25 > max_vel_x 0.20 — Raj review PR4)
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "ObstacleFootprint", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 5.0
      # BaseObstacle.inflate_cost removed: not a Jazzy BaseObstacleCritic parameter (inert) — Raj review PR4
      ObstacleFootprint.scale: 10.0
      PathAlign.scale: 16.0    # 32->16: less aggressive heading-to-path pull (heavy robot was snaking)
      PathAlign.forward_point_distance: 0.30   # 0.1->0.30: look further ahead -> smoother, less twitchy
      GoalAlign.scale: 12.0    # 24->12: same, near the goal
      GoalAlign.forward_point_distance: 0.30
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.6
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # rear edge x -0.390 / -0.290, chassis 780 mm (Alex decision 2026-10-12, STEP MMP.00.00.00.000).
      # was rear x -0.365 / -0.265, superseded by Alex decision 2026-10-12:
      # footprint: "[[0.415, 0.19], [0.415, -0.19], [0.315, -0.29], [-0.265, -0.29], [-0.365, -0.19], [-0.365, 0.19], [-0.265, 0.29], [0.315, 0.29]]"
      footprint: "[[0.415, 0.19], [0.415, -0.19], [0.315, -0.29], [-0.290, -0.29], [-0.390, -0.19], [-0.390, 0.19], [-0.290, 0.29], [0.315, 0.29]]"
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.15
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.10
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      # True: republishes the FULL grid every cycle (publish_frequency) instead of a single
      # latched send + deltas. Avoids "No map received" in RViz when connecting after
      # launch / over WiFi (the transient_local sample is not always delivered to the late-joiner).
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.6
      # rear edge x -0.390 / -0.290, chassis 780 mm (Alex decision 2026-10-12, STEP MMP.00.00.00.000).
      # was rear x -0.365 / -0.265, superseded by Alex decision 2026-10-12:
      # footprint: "[[0.415, 0.19], [0.415, -0.19], [0.315, -0.29], [-0.265, -0.29], [-0.365, -0.19], [-0.365, 0.19], [-0.265, 0.29], [0.315, 0.29]]"
      footprint: "[[0.415, 0.19], [0.415, -0.19], [0.315, -0.29], [-0.290, -0.29], [-0.390, -0.19], [-0.390, 0.19], [-0.290, 0.29], [0.315, 0.29]]"
      resolution: 0.05
      track_unknown_space: false
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.10
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.5   # 2.5->3.5: cout retombe plus vite -> halo dur plus mince -> moins de "depart en quasi-collision"/recovery
        inflation_radius: 0.35   # 0.20->0.35: the GLOBAL PLAN keeps further from the walls (path padding)
      # True: republishes the FULL grid every cycle (cf local_costmap) -> RViz always has it,
      # no more "No map received" at launch / over WiFi.
      always_send_full_costmap: True

map_server:
  ros__parameters:
    yaml_filename: ""  # Overridden at launch time via the 'map' argument (localization_launch.py / bringup.launch.py)

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased", "StationPlanner"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.5
      # Plan on a 2x-downsampled grid (0.05 -> 0.10 m): ~4x fewer A* nodes, so the
      # global plan computes far faster (the 'takes too long to think' at 0.05 m
      # full-res was the main planner cost). Path is a touch coarser but adequate;
      # the local costmap (0.05 m) still handles fine obstacle avoidance.
      downsample_costmap: true
      downsampling_factor: 2
      use_astar: true
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      # Cap planning time hard so a hard plan cannot stall the robot for 2 s.
      max_planning_time: 1.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2

    # Station approach only (navigate_to_station.xml): NavFn ends its path at the goal pose itself, so the station goal
    # checker compares the robot with the goal and not with a cell centre of the downsampled Smac2D grid.
    StationPlanner:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.0
      use_astar: false
      allow_unknown: true
      use_final_approach_orientation: false

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    # Spin and wait only (D-19; #90's behaviour set, Proposed for Baseline 1 20 Nov 2026): backup, drive_on_heading
    # and assisted_teleop are directly callable actions that can reverse the base, whatever the trees call.
    behavior_plugins: ["spin", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # Aligned to the SINGLE approved real-robot limit = the DWB limits below (Raj review PR4):
    # max_velocity matches max_vel_x / max_vel_theta; accel/decel match acc_lim_* / decel_lim_*.
    max_velocity: [0.20, 0.0, 0.5]   # = max_vel_x 0.20, max_vel_theta 0.5
    # linear x 0.0, was -0.20 (D-19; #90's behaviour set): the last clamp before collision_monitor, so no upstream
    # source reverses past it. Angular z keeps -0.5: turning in place does not reverse the base.
    min_velocity: [0.0, 0.0, -0.5]
    max_accel: [1.0, 0.0, 3.0]       # = acc_lim_x 1.0, acc_lim_theta 3.0 (stiction-deadlock fix)
    max_decel: [-2.5, 0.0, -3.0]     # = decel_lim_x -2.5, decel_lim_theta -3.0
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    # platform-sw#90 (Alex's review): 1.0 s let a stopped teleop/any other
    # source keep driving for up to a full second after its publisher went
    # silent - too long for a functional stop. 0.3 s matches the
    # software_stop lock's own timeout (twist_mux.yaml locks.software_stop),
    # so the smoother itself does not become the longest link in the stop
    # chain. See docs/safety/02_limits_and_watchdog.md and
    # test_velocity_smoother_publisher_loss_distance.py (distance bound for
    # a lost publisher, run against the real node).
    velocity_timeout: 0.3

collision_monitor:
  ros__parameters:
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 0.8
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan_filtered"
      min_height: 0.15
      max_height: 2.0
      min_range: 0.15
      enabled: True

docking_server:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5

    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false

      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1

    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
      use_collision_detection: true
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3

loopback_simulator:
  ros__parameters:
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    map_frame_id: "map"
    scan_frame_id: "base_scan"
    update_duration: 0.02
