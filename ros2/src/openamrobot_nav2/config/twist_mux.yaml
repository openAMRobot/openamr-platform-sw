# Command arbitration for issue #35. Values posted by Kunal (skunal3318) on the
# issue thread ahead of PR, ahead of the 25th deadline:
# https://github.com/openAMRobot/openamr-platform-sw/issues/35
#
# twist_mux 4.5.0 (Jazzy) semantics, checked against its source:
#   - a topic is masked when it has timed out or its priority is strictly
#     LOWER than the highest currently-engaged lock (equal priority is NOT
#     masked - software_stop's own input is priority 255, same as its lock,
#     so the lock does not end up masking itself);
#   - twist_mux only republishes whichever input is selected; it never
#     publishes a zero by itself, not on timeout and not when a lock
#     engages - openamrobot_nav2/safety_stop_gate_node.py is what actually
#     puts a zero Twist on cmd_vel_stop while locked;
#   - use_stamped is one switch for every input in 4.5.0. This stack (Gazebo
#     bridge, Teensy micro-ROS) only takes plain Twist, so it is set false
#     globally; the one stamped source (/ui/cmd_vel, TwistStamped) is
#     relayed down to plain Twist on cmd_vel_joy by
#     openamrobot_nav2/ui_cmd_vel_relay_node.py before it ever reaches here.
#
# The output (cmd_vel_mux) feeds openamrobot_nav2/safety_stop_gate_node.py
# (platform-sw#90, Alex's review), which force-zeroes it while locked and
# republishes it as cmd_vel_gated - the equal-priority nonzero-stop gap below
# is closed there, by checking the lock directly, not by this arbitration
# alone. cmd_vel_gated then feeds velocity_smoother, then collision_monitor,
# which stays the only publisher of the final /cmd_vel to the base.
twist_mux:
  ros__parameters:
    use_stamped: false
    topics:
      navigation:            # controller_server and behavior_server (via #54 remap)
        topic: cmd_vel_nav
        timeout: 0.5
        priority: 10
      docking:               # dock_trigger, remapped onto cmd_vel_dock (was /cmd_vel)
        topic: cmd_vel_dock
        timeout: 0.3
        priority: 20
      manual:                # ui_cmd_vel_relay_node's output; UI's "drive" control
        topic: cmd_vel_joy
        timeout: 0.25
        priority: 100
      software_stop:         # zero Twist from safety_stop_gate_node while locked
        topic: cmd_vel_stop
        # Must stay >= locks.software_stop.timeout (0.3, below). Both this
        # input and the lock are republished by the same node
        # (safety_stop_gate_node) on the same tick, so in normal operation
        # they age in lockstep and the ordering is a no-op - it only matters
        # once that node stops publishing (crash; see its own docstring,
        # [Loss of the zero publisher while locked]). The lock expiring
        # (at 0.3s) forces the mux into fail-closed/locked regardless of its
        # last received value (see the locks.software_stop comment below);
        # keeping this input's own timeout >= that means the last-known-zero
        # Twist is still a valid, selectable candidate at the moment masking
        # kicks in, so the mux has SOMETHING to select rather than going
        # instantly silent the moment it re-engages. If this timeout were
        # SHORTER than the lock's, the input would already have expired by
        # the time the lock forces closed, moving the "mux has nothing valid
        # to select, no cmd_vel_mux message at all" window earlier, not later.
        # (The actual downstream safety fix no longer depends on this input
        # winning arbitration at all - see cmd_vel_gated / safety_stop_gate_
        # node.py's [Equal-priority nonzero stop] - but this ordering still
        # bounds how long cmd_vel_mux itself goes silent while locked, which
        # is what test_twist_mux_startup_and_restart.py measures.)
        timeout: 0.5
        priority: 255
    locks:
      software_stop:         # functional stop, NOT the safety function (hardwired E-stop)
        topic: /safety/stop_lock   # std_msgs/Bool, true = engaged; masks every input below 255
        # Mohamed's review (platform-sw#90): twist_mux's own LockTopicHandle
        # subscribes with rclcpp::SystemDefaultsQoS() (volatile), so it never
        # receives safety_stop_gate_node's TRANSIENT_LOCAL retained sample -
        # only a live message published after it subscribes. With timeout:
        # 0.0, hasExpired() short-circuits to false forever (see
        # twist_mux/topic_handle.hpp), so isLocked() defaults to false
        # (unlocked) until a real message lands. A fresh or restarted mux is
        # fail-open for that window.
        # timeout: 0.3 flips the default: hasExpired() is
        # (now() - stamp_) > timeout, and stamp_ starts at epoch 0, so a
        # handle that has received nothing is "expired" (locked) immediately
        # at any now() past 0.3s - fail-closed by default, not just once a
        # true sample arrives. During normal operation this is a no-op:
        # safety_stop_gate_node republishes every tick (TICK_HZ=10, period
        # 0.1s), well inside 0.3s, so a live mux's lock never actually
        # expires. See navigation_launch.py for the complementary
        # wall-clock startup stagger covering the use_sim_time cold-start
        # edge case (sim clock near zero at boot, where this epoch-zero
        # trick alone has not yet had 0.3s of simulated time to trip).
        timeout: 0.3
        priority: 255
