# Parameters of the CANDIDATE ZLAC8015D drive and ZLLG80 hub motor model (F1, datasheet-informed at most).
# Model: openamrobot_sil/models/drive_motor.py. Doc: docs/architecture/sil-drive-motor-model.md.
# Test: test/test_drive_motor.py (also checks this file's fields and rules).
#
# Every entry has: value, unit, source, confidence, uncertainty, hardware_revision, owner, test,
# last_verified, measurement_item (and an optional note).
#   confidence: datasheet | supplier_confirmation | design_decision | cad | estimate | unknown
#   value null  <=> confidence unknown; an unknown value names the measurement-plan item (MP-xx,
#   audits branch audit/2026-09-28 digital-twin/phase1/measurement_plan.md) that closes it.
#   last_verified: the date the value was checked against its source document. Nothing in this file
#   was measured on hardware.
# The model refuses to run while a required value is null; tests pass explicit TEST values instead.
#
# Sources used below:
#   ROUTINE: ZLTECH "ZLAC8015D V4.0 CANopen Communication Routine Version 1.07-20250716.pdf",
#     public mirror https://github.com/kaver06/ZLAC8015D_CANOpen_Motor_Controller_simulator @41e2f57
#     Docs/Datasheets, sha256 ec12b36230b702383b1ac153f0666362c07739c683b425dc4bc2514733037892.
#     The package we hold is labelled V4.0; the delivered drive is V4.2 (BOM Issue 7.15 DRV-002) and the
#     V4.2 manual is not filed (gate Q-03). Every drive value here is a V4.0 value.
#   MANUAL: ZLTECH "ZLAC8015 Servo Driver Manual (Special for Hub Servo Motor) V1.01" (2021-01-04), same
#     mirror, ZLAC8015D_help.pdf, sha256 e02039007c3f1cbc25251e33891da12f3c63e600927e2cc6b5eda94d90a24344.
#   LEDGER: openAMRobot/openamr-upperbody-sw PR #65, branch night-shift/actuator-ledger-2026-11-14 @2f871d0,
#     ros2/src/openamrobot_upperbody_description/config/actuator_ledger.yaml (drive_hub_motor_left/right,
#     zlac8015d), which cites the ZLLG80ASM250-L-B2 drawing V1.01 (platform-hw @8ed2b06) and the ZLTECH
#     written answer of 18 Oct 2026 (P-03 item 21, BOM Issue 7.15 row DRV-001).
#   CONFORMANCE: openAMRobot/audits branch audit/2026-09-28 digital-twin/phase1/emulator_conformance/zlac8015d.csv.
