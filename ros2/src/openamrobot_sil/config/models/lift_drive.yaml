# Lift drive model parameters (candidate, F1), read by openamrobot_sil/models/lift_drive.py.
#
# Column DOLD Hexalift V4 350 mm (BS-HM240G350530-MFF24), driven by the upper-body controller
# CTL-017 (NUCLEO-G474RE + Infineon BLDC-SHIELD_IFX007T, BOM Issue 7.15 row CTL-017, Evans to
# confirm D-11). Documentation: docs/architecture/sil-lift-drive-model.md.
#
# Every entry has: value, unit, source, confidence, uncertainty, hardware_revision, owner, test,
# last_verified, measurement_item.
# confidence is one of datasheet, supplier_confirmation, design_decision, cad, estimate, unknown.
# value null means unknown; the model then uses the stated fallback (see "fallback" in the entry
# and the model docstring) and lists it in LiftDrive.assumed. last_verified is the date the value
# was last checked against its source, never against hardware: nothing here is measured.
# Measurement items MP-xx are those of audits branch audit/2026-09-28,
# digital-twin/phase1/measurement_plan.md.
schema: openamrobot_sil/lift_drive_parameters/1
status: candidate
fidelity: F1
parameters:
  # --- supply and H-bridge ------------------------------------------------------------------
  bus_voltage_nominal_v:
    value: 24.0
    unit: V
    source: E-01 Safety and Power Distribution Baseline rev1.8 (SAFE 24 V converter MEAN WELL DDR-240B-24, 24 V output); actuator ledger supply_bus_voltage_nominal
    confidence: design_decision
    uncertainty: converter output tolerance not filed
    hardware_revision: DDR-240B-24
    owner: Evans
    test: test_lift_drive.py::test_no_load_speed_anchor
    last_verified: '2026-11-16'
    measurement_item: MP-12
  supply_current_limit_a:
    value: 10.0
    unit: A
    source: E-01 rev1.8 line 68 ("Limit output current to 10 A or less"); converter output rating 10 A
    confidence: design_decision
    uncertainty: converter overload behaviour (constant current or hiccup) not filed; modelled as a hard clamp
    hardware_revision: DDR-240B-24
    owner: Evans
    test: test_lift_drive.py::test_current_is_limited_by_the_supply
    last_verified: '2026-11-16'
    measurement_item: MP-12
  bridge_current_limit_a:
    value: 55.0
    unit: A
    source: Infineon IFX007T data sheet Rev 1.0 (2018-09-11), current limitation level min 55 A, typ 77 A, max 98 A at VS 13.5 V, https://www.infineon.com/dgdl/Infineon-IFX007T-DS-v01_00-EN.pdf
    confidence: datasheet
    uncertainty: min of the range; the level depends on dI/dt. Shield PCB average limit 30 A (Motor Control Shield with IFX007T user manual v1.0)
    hardware_revision: IFX007T
    owner: Evans
    test: test_lift_drive.py::test_current_is_limited_by_the_supply
    last_verified: '2026-11-16'
    measurement_item: null
  bridge_path_resistance_ohm:
    value: 0.010
    unit: ohm
    source: IFX007T data sheet Rev 1.0, path RDS(on) typ 10.0 mohm, max 12.8 mohm at 25 C; one high side and one low side carry the motor current in an H-bridge
    confidence: datasheet
    uncertainty: rises with junction temperature (only typical curves given)
    hardware_revision: IFX007T
    owner: Evans
    test: test_lift_drive.py::test_parameters_have_every_field
    last_verified: '2026-11-16'
    measurement_item: null
  current_sense_ratio:
    value: 19500
    unit: '1'
    source: IFX007T data sheet Rev 1.0, dkILIS 15000 / 19500 / 24000 (min / typ / max)
    confidence: datasheet
    uncertainty: -23 % / +23 % without calibration
    hardware_revision: IFX007T
    owner: Evans
    test: test_lift_drive.py::test_current_report_gain_and_resolution
    last_verified: '2026-11-16'
    measurement_item: MP-14
  current_sense_ratio_actual:
    value: null
    unit: '1'
    source: null
    confidence: unknown
    uncertainty: within 15000 to 24000
    hardware_revision: IFX007T
    owner: Evans
    test: test_lift_drive.py::test_current_report_gain_and_resolution
    last_verified: null
    measurement_item: MP-14
    fallback: current_sense_ratio (reported current equals motor current)
  current_report_resolution_a:
    value: 0.001
    unit: A
    source: CTL-017 v1 object dictionary (openamr-upperbody-fw PR #15 at 1a68c50), TPDO2 motor_current u16 mA
    confidence: design_decision
    uncertainty: none (wire format of a proposal)
    hardware_revision: CTL-017 OD v1
    owner: Evans
    test: test_lift_drive.py::test_current_report_gain_and_resolution
    last_verified: '2026-11-16'
    measurement_item: null
  pwm_frequency_hz:
    value: 25000
