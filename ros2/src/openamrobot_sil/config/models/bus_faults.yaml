error_model:
  # ISO 11898-1 fault confinement. A standard, filed nowhere in the project yet: the clause is
  # named in the source and the confidence is manufacturer_document by analogy.
  tec_tx_error_increment: &iso
    {value: 8, unit: count, source: "ISO 11898-1:2015 clause 12.1.4 (fault confinement rules)",
     confidence: manufacturer_document, uncertainty: "exceptions of the standard (ACK error while error-passive, stuff error in an arbitration flag) are not modelled",
     hardware_revision: n/a, owner: firmware and base controller owner,
     test: test_bus_faults.py::test_error_counter_state_machine, last_verified: null,
     measurement_item: MP-10}
  success_decrement: {<<: *iso, value: 1}
  rec_rx_error_increment: {<<: *iso, value: 1}
  rec_rx_error_severe_increment: {<<: *iso, value: 8}
  rec_passive_success_value: {<<: *iso, value: 127, uncertainty: the standard allows 119 to 127}
  error_passive_threshold: {<<: *iso, value: 128}
  bus_off_threshold: {<<: *iso, value: 256}
  recovery_sequences: {<<: *iso, value: 128, test: test_bus_faults.py::test_bus_off_manual_recovery_timing}
  recovery_sequence_bits: {<<: *iso, value: 11, unit: bit, test: test_bus_faults.py::test_bus_off_manual_recovery_timing}
  error_frame_bits:
    {value: 23, unit: bit, source: "ISO 11898-1:2015 (error flag up to 12 bits including superposition, delimiter 8, intermission 3)",
     confidence: estimate, uncertainty: 17 to 23 bits depending on the flag superposition; worst case used,
     hardware_revision: n/a, owner: firmware and base controller owner,
     test: test_bus_faults.py::test_tx_errors_drive_bus_off_and_cost_bus_time, last_verified: null,
     measurement_item: MP-15}
  passive_suspend_bits:
    {value: 8, unit: bit, source: "ISO 11898-1:2015 (suspend transmission of an error-passive transmitter)",
     confidence: manufacturer_document, uncertainty: none in the model,
     hardware_revision: n/a, owner: firmware and base controller owner,
     test: test_bus_faults.py::test_tx_errors_drive_bus_off_and_cost_bus_time, last_verified: null,
     measurement_item: MP-15}
  default_bus_off_recovery:
    {value: manual, unit: mode, source: "SIL test value: a bus-off stays until recovery is requested, like Linux restart-ms 0 (RG-COM-004)",
     confidence: estimate, uncertainty: used only where a bus has no recovery value,
     hardware_revision: n/a, owner: firmware and base controller owner,
     test: test_bus_faults.py::test_bus_off_manual_recovery_timing, last_verified: null,
     measurement_item: MP-10}

