profiles:
  # SIL test values. Not measured, not proposals for the real bus.
  nominal:
    seed: 0
    can: {}
    uart: {}
  degraded:
    seed: 20261116
    can:
      drive:
        - {name: drive_rx_heartbeat, arbitration_id: 0x700, mask: 0x780, direction: rx,
           delay_s: 0.002, jitter: {distribution: uniform, low_s: 0.0, high_s: 0.003},
           loss_p: 0.01}
        - {name: drive_tx_targets, arbitration_id: 0x600, mask: 0x780, direction: tx,
           delay_s: 0.001, jitter: {distribution: exponential, mean_s: 0.0005},
           loss_p: 0.005, duplicate_p: 0.002, reorder_p: 0.01, reorder_window_s: 0.005}
      bms:
        - {name: bms_answers, arbitration_id: 0x0, mask: 0x0, extended: true, direction: rx,
           delay_s: 0.010, jitter: {distribution: normal, mean_s: 0.0, sigma_s: 0.003},
           burst: {rate_hz: 0.05, duration_s: 0.5}}
    uart:
      tof_front: {byte_loss_p: 0.001, framing_error_p: 0.0005,
                  noise_burst_rate_hz: 0.1, noise_burst_duration_s: 0.002}
      lidar: {byte_loss_p: 0.0001}
