# CAN and UART fault and timing layer of openamrobot_sil (W4, Proposed, 16 Nov 2026).
# Read by openamrobot_sil/models/bus_faults.py (load_config, build_can, build_uart) and checked
# by test/test_bus_faults.py. Documentation: docs/architecture/sil-bus-fault-layer.md.
#
# Every physical parameter is a record with the fields
#   value, unit, source, confidence, uncertainty, hardware_revision, owner, test,
#   last_verified, measurement_item
# confidence: measured | manufacturer_document | cad | design_decision | estimate | unknown
# (vocabulary of audits digital-twin/phase1/CONVENTIONS.md). An unknown value is null and names
# a measurement item (MP-xx of audits digital-twin/phase1/measurement_plan.md). Nothing here is
# measured: last_verified is null everywhere.
# Owners are roles of Team doc section 7, not persons.
#
# References use <repo>@<sha>:<path>#L<line>. audits@d776cec is the audits main branch read on
# 16 Nov 2026; platform-sw@fe071f4 is the base of this branch (ws1/clock-contract).
#
# `profiles` are scenario settings (fault rates chosen for a test), not properties of the real
# bus. They are SIL test values and are not parameter records.
version: 1
status: Proposed

