    hardware_revision: null
    owner: Evans
    test: test_ocv_is_monotonic_and_interpolates
    last_verified: null
    measurement_item: MP-12 (RG-DRV-024)
    sil_default: [[0, 2.50], [5, 3.00], [10, 3.20], [20, 3.25], [40, 3.28], [60, 3.30], [80, 3.32], [90, 3.33], [95, 3.35], [100, 3.45]]
