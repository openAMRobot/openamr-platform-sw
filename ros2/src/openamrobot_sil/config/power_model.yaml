# Battery and power model parameters of openamrobot_sil (proposal, 16 Nov 2026).
# Read by openamrobot_sil/model_params.py; equations and the rail topology are in
# docs/architecture/sil-battery-model.md.
#
# Every parameter has the same fields:
#   value              robot value, or null when no source gives it. Never a guess.
#   unit               SI unit ('1' for a count or a ratio)
#   source             document, row and revision (URL for a public datasheet)
#   confidence         datasheet | supplier_confirmation | design_decision | cad | estimate | unknown
#   uncertainty        range or conflict as stated by the source; 'none stated' if the source gives none
#   hardware_revision  revision of the part or document the value belongs to
#   owner              who confirms or replaces the value
#   test               test in test/test_battery_model.py or test/test_power_model.py that uses it
#   last_verified      date of a bench measurement on the robot's own part; null = never measured
#   measurement_item   measurement plan item (audits digital-twin/phase1/measurement_plan.md) and RG rows
#   sil_default        only where value is null: the number the SIL runs with so the layer works.
#                      Not a property of the robot, never acceptance evidence; the model reports
#                      every parameter that runs on its sil_default (state key defaults_in_use).
#
# Rail topology follows E-01 rev1.8 section 3 (power distribution). The model never decides a
# contactor, precharge relay, disconnect or BMS switch state: those are inputs (decision D11).
version: 1

pack:
  n_series:
    value: 8
    unit: '1'
    source: BOM Issue 7.15 Hardware BOM row PWR-001 (8 x EVE LF105, 8S1P, 25.6 V)
    confidence: design_decision
    uncertainty: none stated
