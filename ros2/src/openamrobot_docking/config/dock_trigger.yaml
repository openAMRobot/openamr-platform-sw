/**:
  ros__parameters:
    # ─── Trigger topic ─────────────────────────────────────────────────────────
    # Publish std_msgs/Bool true on this topic to start the docking sequence.
    # Publish false to trigger undock when `undock_on_false: true`.
    trigger_topic: dock_trigger
    undock_on_false: false

    # ─── Undock + goal gate ───────────────────────────────────────────────────
    # Publish std_msgs/Bool true on undock_trigger_topic to undock: reverse
    # undock_reverse_distance metres straight back, then spin 180° in place.
    #
    # goal_pose_topic / goal_pose_forward_topic implement undock-before-navigate.
    # The Nav2 bt_navigator is remapped (in navigation_launch.py) to listen on
    # goal_pose_forward_topic instead of goal_pose, so this node owns goal_pose:
    # a navigation goal received while docked triggers an undock first, then the
    # goal is republished on goal_pose_forward_topic for Nav2. When not docked
    # the goal passes straight through.
    undock_trigger_topic: undock_robot
    goal_pose_topic: goal_pose
    goal_pose_forward_topic: goal_pose_nav
    undock_reverse_distance: 1.0        # m — straight-line reverse before turning
    undock_reverse_speed: 0.10          # m/s — reverse speed magnitude

    # Legacy fields read by opennav_docking::SimpleChargingDock — kept so the
    # real-robot launch can fall back to the upstream pipeline. The 7-phase
    # sequencer ignores them and runs its own NavigateToPose + control loop.
    use_dock_id: true
    dock_id: home_dock
    dock_type: openamrobot_dock
    navigate_to_staging_pose: false

    # ─── Dock pose in the map frame ───────────────────────────────────────────
    # The third value is the *approach yaw* — the heading the robot has when
    # docked (facing the tag).
    #
    # Sim layout (Raj's walled_world.sdf): robot spawns at world (0, 0) and
    # AMCL initialises at map (0, 0) → map ≡ world. The AprilTag dock sits
    # on the inner face of the +x wall at world (4.899, 0) with the tag
    # normal pointing −x (SDF yaw = π). The robot approaches from the
    # inside of the room facing +x, so the approach yaw is 0.
    dock_pose_x: 1.730
    dock_pose_y: 0.035
    dock_pose_yaw: 0.0

    # ─── Phase 1 — Nav2 NavigateToPose to the staging zone ───────────────────
    # Distance (m) in front of the dock at which the robot first stops, and
    # the distance at which the perpendicular-line tracking begins. With
    # the 0.40 m AprilTag and the 1.047 rad camera FOV (Raj's setup), 1.5 m
    # gives ~120 px of tag in the image — comfortable for sub-pixel solvePnP.
    staging_distance: 2.0
    # Hold (s) at staging before the tag search begins, so velocity decays
    # smoothly and the camera image stabilises.
    staging_hold_seconds: 1.0

    # ─── Phase 2 — tag search & centring scan ────────────────────────────────
    # After Nav2 reaches the staging zone the robot rotates in place to
    # centre the tag in the camera image. The scan operates in two regimes:
    #
    #   - open-loop rotation at scan_rotation_speed when no detection;
    #   - closed-loop yaw P-control (omega = −scan_centring_kp × atan2(X,Z)
    #     in camera_optical frame) once the tag is in view.
    #
    # It exits when the tag is within scan_centring_tolerance of the image
    # centre for scan_consecutive_target frames in a row.
    #
    # Using the camera-frame angle rather than the running-average map
    # position means the centring is robust to solvePnP map-frame bias:
    # the tag is centred as it ACTUALLY appears in the image.
    scan_rotation_speed: 0.30            # rad/s — open-loop search spin + clamp on centring.
                                         # 0.17 (just above the 0.15 floor) was too close to
                                         # the STATIC-friction limit to reliably START a
                                         # spin-in-place from rest → the robot juddered in
                                         # place and never searched ('tags not detected during
                                         # scan'). 0.30 breaks stiction and sweeps; centring
                                         # tolerance (±2°) still hit cleanly on the real robot.
    scan_consecutive_target: 5          # centred frames in a row
    scan_centring_tolerance: 0.035      # rad ≈ 2° — tag must be this close to image centre
    scan_centring_kp: 1.0               # rad/s per rad of image-frame angle

    # ─── Phase 2 — initial filter (running average seed) ─────────────────────
    # Number of samples folded into the running-average tag pose before
    # phase 3 (the spin to perpendicular). The running average then keeps
    # updating throughout phase 4.
    filter_num_samples: 40
    # Maximum time (s) to wait for filter_num_samples. The tag publisher
    # runs at ~10 Hz, so 40 samples need ≥4 s plus margin.
    filter_max_collect_time: 6.0

    # ─── Phase 3 — spin in place to perpendicular yaw ────────────────────────
    spin_kp: 1.5
    spin_max_omega: 0.5                  # rad/s clamp. 0.3 made the 180° undock
                                         # spin too slow (timed out); 0.5 keeps
                                         # precision (P-loop slows near target).
    # Phase 3 exits when |yaw_err| < spin_yaw_tolerance. 0.02 rad ≈ 1.1°.
    spin_yaw_tolerance: 0.02

    # ─── Phase 4 — line-tracking advance (pure-pursuit) ──────────────────────
    # Drive forward toward the running-average tag while steering to stay on
    # the perpendicular line through the averaged tag centre.
    #
    # Pure-pursuit control law:
    #
    #     desired_yaw = perp_yaw − atan2(lateral, line_lookahead_distance)
    #     omega       = line_yaw_kp × (desired_yaw − robot_yaw)
    #     omega       saturated by drive_yaw_max_omega
    #
    # The atan2 maps the signed lateral offset to a bounded heading deviation
    # (±π/2). As the robot approaches the line, lateral → 0, so desired_yaw
    # → perp_yaw and the robot arrives perpendicular to the tag — no
    # standing yaw bias at the dock.
    #
    # Tuning intuition:
    #   - smaller line_lookahead_distance = more aggressive lateral
    #     convergence (steeper desired heading at the same offset);
    #   - increase line_yaw_kp to track desired_yaw faster (note the
    #     drive_yaw_max_omega saturation);
    #   - if the robot oscillates near the line, increase lookahead
    #     distance or decrease line_yaw_kp.
    docking_distance: 0.25              # m — final CAMERA→tag depth at the dock.
                                         # Camera-centric pipeline (docs §6) stops
                                         # here. The tag leaves the FOV before this,
                                         # so the last stretch is a blind straight
                                         # advance (odometry-measured).
    drive_speed: 0.12                   # m/s — forward speed (tapered near tag). Live-tunable.
                                         # Turn radius = v / omega; the 0.15 rad/s motor floor
                                         # means a slow v forces a tight correction turn that
                                         # swings the camera off the bundle. 0.12 tuned on the
                                         # real robot (2026-07-03): smooth curve onto the axis.
    line_yaw_kp: 1.0                    # rad/s per rad of (desired_yaw − robot_yaw). Live-tunable.
                                         # 1.0 (from 1.5) tuned on the real robot: less aggressive
                                         # → no saturation to ±max on a small offset.
    line_lookahead_distance: 1.0        # m — pure-pursuit lookahead on the dock-normal line.
                                         # Live-tunable. Larger = gentler desired heading at a
                                         # given lateral offset = smoother convergence (less
                                         # zig-zag). 1.0 (from 0.3) tuned on the real robot: a
                                         # 10 cm offset gives omega ~0.15 (was ~0.30 → oscillation).
    drive_yaw_max_omega: 0.35           # rad/s clamp on omega. Widened from 0.2 so
                                         # there is proportional room ABOVE the
                                         # 0.15 rad/s rotation floor (min_turn_omega):
                                         # 0.2 left only a 0.15->0.2 near-bang-bang band.
    drive_rate_hz: 20.0                 # Hz control loop frequency

    # Image-frame visual servo (used by Phase 5 NEAR regime, once the dock
    # axis is frozen). The heading controller closes the loop on the
    # IMAGE-FRAME angle to the centre tag:
    #
    #     omega = -visual_servo_kp · atan2(X_optical, Z_optical)
    #
    # Map-frame solvePnP becomes biased in the near field (corners hugging
    # the edge of the FOV), but the image-frame angle is self-consistent.
    # Keeping the tag centred in the image = aiming straight at the dock.
    # The low-pass filter rejects single-frame solvePnP spikes.
    visual_servo_kp: 1.0                # rad/s per rad of desired_yaw (P term).
                                         # 0.4 put omega below the 0.15 rad/s floor for
                                         # any error < 21deg -> no reactivity. 1.0 gives
                                         # 0.15 rad/s already at ~8.6deg. Tuned against the
                                         # OLD raw-bearing signal — re-tune against
                                         # desired_yaw (see visual_servo_lookahead below).
    visual_servo_lookahead: 0.70        # m — fixed lookahead for desired_yaw = -atan2(lateral,
                                         # lookahead), replacing the raw bearing atan2(X,Z)
                                         # (2026-07-07 fix: Z shrinking through NEAR made the old
                                         # bearing-only P-term intensify purely from getting
                                         # closer, not from real drift). Defaulted equal to
                                         # freeze_axis_distance so desired_yaw is continuous at
                                         # the FAR->NEAR hand-over. Live-tunable.
    visual_servo_kd: 0.2                # rad/s per rad/s — derivative damping so the
                                         # livelier kp does not overshoot near contact.
    visual_servo_filter_alpha: 0.6      # EMA on the bearing; higher = more reactive.
    visual_servo_max_step: 0.35         # rad — reject single-frame solvePnP bearing jumps.
    visual_lost_max_frames: 25          # frames tag-1 may stay lost (~1.25 s @20 Hz)
                                         # before abort. While lost we COAST STRAIGHT
                                         # (were aligned), so this is a coast budget,
                                         # not a stop budget.
    visual_align_deadband: 0.10         # rad (~5.7 deg). Hysteresis: drive straight
                                         # when the bearing is within band, only engage
                                         # a correction past it (release at 0.4x). Kills
                                         # the left-right per-frame hunting.

    # Raj's Nav2 stack does NOT run a velocity_smoother that subscribes to
    # /cmd_vel_nav, so publishing there is a dead end (0 subscribers). We
    # publish straight to /cmd_vel which the gz bridge forwards to the
    # DiffDrive plugin. Nav2's own controller is idle by Phase 4 (its
    # NavigateToPose goal completed in Phase 1), so we don't fight it.
    cmd_vel_topic: /cmd_vel

    # ─── Tag detection topic ─────────────────────────────────────────────────
    detection_topic: /detected_dock_pose
    # Maximum age (s) of a detection message before it is dropped as stale.
    detection_max_age: 1.5

    # ─── Debug visualisation ─────────────────────────────────────────────────
    # Publish the perpendicular approach line (green LINE_STRIP) and the
    # running-average tag centre (red SPHERE) as an RViz MarkerArray during
    # Phase 4. Add a MarkerArray display on debug_marker_topic in RViz to see
    # it. See docs/13_perception_and_line.md.
    publish_debug_markers: true
    debug_marker_topic: /docking/debug_markers

    # Mirror the same line + tag centre INSIDE the Gazebo GUI. Gazebo does not
    # consume ROS markers, so this pushes a gz.msgs.Marker_V to the gz marker
    # service via the `gz` CLI (throttled, off-thread). Map ≡ world in this sim.
    # Set publish_gz_marker false if you only use RViz, or if the gz service
    # name differs on your Gazebo version (adjust gz_marker_service then).
    publish_gz_marker: true
    gz_marker_service: /marker_array
    gz_marker_period: 0.4               # s — min interval between gz CLI calls

    # ─── Camera-centric approach (two-sided normal estimation) ───────────────
    # See docs/13_perception_and_line.md §6. Estimate the tag normal from two
    # sides (cancels solvePnP view-angle bias), go to a point on the normal,
    # re-verify, then do a camera-only final approach (immune to wheel slip).
    too_close_distance: 1.0            # m — if closer at arrival, back off first
    predock_distance: 2.0              # m on the normal (P1) — far enough to see all 3 tags
    refined_predock_distance: 1.50     # m on the normal (P2, if N' disagrees)
    normal_tolerance_deg: 5.0          # deg — N vs N' agreement threshold
    obs_lateral: 0.5                   # m — side offset for the 2nd observation
    obs_distance: 2.0                  # m from the tag for the 2nd observation
    # Phase 5 hand-over: FAR (> this) average the 3-tag axis + pure-pursuit it;
    # NEAR (≤ this) freeze the axis and finish on the centre-tag visual
    # corrector. Freezing kills the close-range zig-zag (noisy near estimates).
    freeze_axis_distance: 0.70         # m camera→centre tag. FAR→NEAR hand-over:
                                         # ABOVE this the robot pure-pursuits the 3-tag
                                         # dock normal (now in the ROBOT frame — see
                                         # use_camera_frame_normal — so it aligns both
                                         # laterally AND perpendicular to the dock);
                                         # BELOW it the outer tags leave the FOV so it
                                         # finishes on the centre-tag bearing corrector.
                                         # Live-tunable (re-read each loop).
    # Phase-5 FAR normal computed in the ROBOT frame (base_link) not the map frame.
    # true = the final approach never reads the wobbly map (AMCL relocalisation jumps)
    # or odometry drift; the dock axis is re-derived from the live camera TF every loop
    # and pure-pursuit corrects lateral offset + approach heading. false = legacy line.
    use_camera_frame_normal: true
    # EMA weight for the live axis estimate. A plain cumulative mean freezes
    # the early off-axis (wrong) estimates; the EMA keeps following the recent
    # better ones. Higher = more reactive/noisier, lower = smoother/more stable.
    # Weight ∝ depth/predock_distance (far = more trust, near = less — see
    # dock_trigger.py, inverted 2026-07-07), capped in code. 0.40 was still
    # visibly jittery/changing too much mid-course on real hardware
    # (2026-07-07 user feedback: "la ligne est trop variable... qu'un petit peu
    # à mi-course") — lowered to 0.12 for a much heavier, more stable average
    # throughout the approach, not just near the dock.
    axis_filter_alpha: 0.12

    # ─── Obstacle avoidance during drive phases ──────────────────────────────
    # The sequencer publishes cmd_vel straight to the robot, bypassing
    # Nav2's collision_monitor. We re-add a simple obstacle guard inside
    # the docking forward-drive phase (pure-pursuit onto the dock normal,
    # _goto_point_on_normal / _drive_to_xy) and the undock reverse
    # (run_undock_sequence / _reverse_distance):
    #
    #   - BEFORE each guarded phase, a "garde-fou" pre-check verifies the
    #     path is clear. If blocked, the robot stops and waits up to
    #     obstacle_wait_timeout seconds for the path to clear; if still
    #     blocked after the timeout, the phase aborts.
    #   - DURING the phase, the same check runs every control-loop
    #     iteration. Same wait-or-abort behaviour.
    #
    # Phase 5 (IBVS final approach onto the dock) deliberately skips this
    # — the dock itself is "an obstacle" we are approaching on purpose.
    # The centring scan / spin-in-place phases also skip it (no translation
    # into anything).
    #
    # The check is purely angular: a cone centred on the forward axis
    # (0 rad) or backward axis (π rad), with the configured half-width.
    # Angles are interpreted in the LIDAR scan frame; assumes the LIDAR
    # is roughly aligned with base_link forward (a small lateral offset
    # does not change the cone meaningfully).
    obstacle_check_enabled: false
    # Use /scan_filtered (Nav2's scan_body_filter chain) — it chops the
    # angular sector where the LIDAR sees the robot's own enclosure (rear
    # ±40°), so close-range returns inside the kept sector are GENUINE
    # obstacles, not self-reflections. This is angle-based filtering, the
    # correct primitive: a distance-based floor (obstacle_min_range > 0)
    # would silently ignore a real near obstacle inside the body-filter
    # sector, which is unsafe.
    #
    # The forward cone is the only direction we guard: the rear ±40° is
    # blank on /scan_filtered (chopped sector), so a backward check would
    # be a no-op. Undock therefore proceeds without rear guard — see
    # `run_undock_sequence` docstring for the rear-sensor prerequisite
    # before re-introducing one.
    obstacle_scan_topic: /scan_filtered
    obstacle_forward_distance: 0.6           # m — stop if obstacle within this distance ahead
    obstacle_arc_half_width_deg: 30.0        # deg — half-width of the detection cone (so a full 60° arc)
    obstacle_wait_timeout: 10.0              # s — max wait before aborting the phase
    obstacle_check_period: 0.2               # s — poll period while waiting for the path to clear
    # Range floor — kept at 0 (disabled) because self-reflections from the
    # robot's body are already removed by /scan_filtered (angle-based filter
    # in scan_body_filter). Do NOT raise this above scan.range_min: a >0
    # floor would silently ignore real obstacles closer than the floor
    # inside the angular sector kept by the body filter.
    obstacle_min_range: 0.0                  # m — 0 = disabled (rely on /scan_filtered)
