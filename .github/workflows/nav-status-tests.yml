name: nav-status-tests

on:
  pull_request:
    paths:
      - 'ros2/src/openamrobot_nav2/**'
      - '.github/workflows/nav-status-tests.yml'
  push:
    branches: [main]
    paths:
      - 'ros2/src/openamrobot_nav2/**'
      - '.github/workflows/nav-status-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  # openamrobot-interfaces revision the producer is built and tested against.
  # Change it on purpose when openamr_nav_msgs changes.
  #
  # Temporarily pinned to the fork/branch backing openamrobot-interfaces#35,
  # not upstream main (platform-sw#90, Mohamed's review): this PR's
  # safety_stop_gate_node.py imports StopState from that still-open PR, and
  # upstream main's openamr_nav_msgs does not have it yet, so CI would fail
  # at collection against main. Revert INTERFACES_REPO to
  # openAMRobot/openamrobot-interfaces and INTERFACES_REF to a main commit
  # (dropping this note) once interfaces#35 merges.
  INTERFACES_REPO: skunal3318/openamrobot-interfaces
  INTERFACES_REF: cb83b228b2e01dd795bde729d0097869ee18c9a6

jobs:
  producer-tests:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Check out openamrobot-interfaces at the recorded revision
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INTERFACES_REPO }}
          ref: ${{ env.INTERFACES_REF }}
          path: interfaces

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            python3-colcon-common-extensions \
            python3-pytest \
            python3-yaml \
            ros-jazzy-nav2-msgs \
            ros-jazzy-tf2-ros-py \
            ros-jazzy-twist-mux \
            ros-jazzy-nav2-velocity-smoother \
            ros-jazzy-nav2-bt-navigator \
            ros-jazzy-nav2-behaviors \
            ros-jazzy-nav2-controller \
            ros-jazzy-nav2-planner \
            ros-jazzy-nav2-collision-monitor \
            ros-jazzy-nav2-lifecycle-manager \
            ros-jazzy-opennav-docking

      - name: Build openamr_nav_msgs and the producer
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          mkdir -p ws/src
          cp -r interfaces/ros2/openamr_nav_msgs ws/src/
          cp -r ros2/src/openamrobot_nav2 ws/src/
          cd ws
          colcon build --packages-select openamr_nav_msgs openamrobot_nav2

      # OPENAMR_REQUIRE_INTERFACES turns a missing openamr_nav_msgs into a
      # failure instead of a skipped suite. OPENAMR_REQUIRE_TWIST_MUX does
      # the same for twist_mux/nav2_velocity_smoother (platform-sw#90, Alex's
      # review) - both are apt-installed above, so a skip here would hide a
      # broken install step behind a passing job.
      - name: Run the producer tests
        shell: bash
        env:
          OPENAMR_REQUIRE_INTERFACES: '1'
          OPENAMR_REQUIRE_TWIST_MUX: '1'
        run: |
          source /opt/ros/jazzy/setup.bash
          source ws/install/setup.bash
          python3 -m pytest -v \
            ros2/src/openamrobot_nav2/test/test_sensor_tracker.py \
            ros2/src/openamrobot_nav2/test/test_status_trackers.py \
            ros2/src/openamrobot_nav2/test/test_status_rules.py \
            ros2/src/openamrobot_nav2/test/test_navigation_status_node.py \
            ros2/src/openamrobot_nav2/test/test_recovery_goal_handoff_full_chain.py \
            ros2/src/openamrobot_nav2/test/test_navigation_launch_cmd_vel_routing.py \
            ros2/src/openamrobot_nav2/test/test_safety_stop_gate_node.py \
            ros2/src/openamrobot_nav2/test/test_goal_authority.py \
            ros2/src/openamrobot_nav2/test/test_ui_cmd_vel_relay_node.py \
            ros2/src/openamrobot_nav2/test/test_twist_mux_startup_and_restart.py \
            ros2/src/openamrobot_nav2/test/test_navigation_launch_velocity_smoother_routing.py \
            ros2/src/openamrobot_nav2/test/test_velocity_smoother_publisher_loss_distance.py \
            ros2/src/openamrobot_nav2/test/test_docking_full_chain_through_real_mux.py \
            ros2/src/openamrobot_nav2/test/test_sim_clock_readiness_full_chain.py \
            ros2/src/openamrobot_nav2/test/test_stop_contract_full_chain.py \
            ros2/src/openamrobot_nav2/test/test_gate_crash_full_chain_cmd_vel_bound.py \
            ros2/src/openamrobot_nav2/test/test_navigation_launch_no_waypoint_follower.py \
            ros2/src/openamrobot_nav2/test/test_behavior_trees_no_backup.py \
            ros2/src/openamrobot_nav2/test/test_nav2_params_no_reverse.py \
            ros2/src/openamrobot_nav2/test/test_navigate_to_pose_goal_proxy_node.py \
            ros2/src/openamrobot_nav2/test/test_navigate_through_poses_goal_proxy_node.py \
            ros2/src/openamrobot_nav2/test/test_navigation_launch_navigate_to_pose_proxy_remap.py \
            ros2/src/openamrobot_nav2/test/test_navigation_launch_navigate_through_poses_proxy_remap.py \
            ros2/src/openamrobot_nav2/test/test_navigation_launch_waypoint_follower_server_absent.py \
            ros2/src/openamrobot_nav2/test/test_navigation_launch_bt_xml_resolves_to_no_backup.py \
            ros2/src/openamrobot_nav2/test/test_navigation_launch_behavior_server_direct_actions_absent.py
          # (platform-sw#90, Alex's 13 Nov review, item 4): the five tests
          # above that need a real bt_navigator - the two proxy-remap tests
          # plus the three "absence" tests - now run hosted, now that
          # "Install dependencies" installs nav2-bt-navigator/nav2-behaviors/
          # nav2-controller/nav2-planner/nav2-collision-monitor/nav2-
          # lifecycle-manager/opennav-docking. This was previously an owner
          # decision not yet made (see STATE.md history); Alex made it. The
          # two test_navigate_*_goal_proxy_node.py tests above never needed
          # this - each stands up its own fake "real" action server directly
          # in-process, no navigation_launch.py or bt_navigator involved.
          #
          # test_d13_real_dock_trigger_clean_boot_and_exclusion.py
          # (platform-sw#124/#90) is STILL deliberately NOT run here: it
          # needs openamrobot_docking (apriltag_msgs, apriltag_ros,
          # openamrobot_gazebo), a different dependency footprint than the
          # ros-jazzy-opennav-docking apt package added above (that is the
          # Nav2-stack docking server navigation_launch.py depends on per
          # package.xml, not the AprilTag-based openamrobot_docking package
          # this test exercises) - not covered by item 4, still an owner
          # decision. Runs and passes locally - see STATE.md.

      # tools/issue35_arbitration/stop_lock_invariants.py (platform-sw#90, Alex's
      # review): the graph-shape invariant the Python tests above cannot check
      # from inside a single node (no publisher ACL in ROS) - that
      # safety_stop_gate_node is the ONLY publisher on its lock/stop-channel
      # topics and the only server on its release/engage services. Only needs
      # the gate itself running, not twist_mux or a sim.
      # The gate's own stdout/stderr is captured and always printed, and its
      # liveness is asserted before and after the check (platform-sw#90,
      # Mohamed's review): the previous version backgrounded the gate and
      # checked a fixed 2 s later, so a gate that exited on startup and a
      # gate that was merely slow both showed up as "zero publishers" -
      # evidence that could not tell a real graph violation from a node
      # that never ran. The invariant itself is unchanged; only readiness
      # and diagnostics were added.
      - name: Run stop_lock_invariants.py against a live gate
        shell: bash
        run: |
          set -o pipefail
          source /opt/ros/jazzy/setup.bash
          source ws/install/setup.bash
          ros2 run openamrobot_nav2 safety_stop_gate_node > gate.log 2>&1 &
          gate_pid=$!
          echo "gate started with pid ${gate_pid}"
          trap 'kill -9 "$gate_pid" 2>/dev/null' EXIT

          if ! kill -0 "$gate_pid" 2>/dev/null; then
            echo "FAIL: the gate process exited before the check even started"
            echo "----- gate.log -----"; cat gate.log || true
            exit 1
          fi

          # --no-check-cmd-vel: this step starts safety_stop_gate_node
          # standalone, not the full navigation_launch stack, so
          # collision_monitor never runs here and /cmd_vel would never get
          # a publisher - that is this step's own reduced scope, not a
          # graph violation (platform-sw#90, Alex's 13 Nov review added the
          # /cmd_vel/collision_monitor check to the tool itself).
          status=0
          python3 tools/issue35_arbitration/stop_lock_invariants.py \
            --await-ready-s 30 --no-check-cmd-vel || status=$?

          echo "----- gate.log -----"; cat gate.log || true
          if ! kill -0 "$gate_pid" 2>/dev/null; then
            wait "$gate_pid" 2>/dev/null; gate_exit=$?
            echo "FAIL: the gate process is no longer running (exit ${gate_exit})"
            exit 1
          fi
          echo "gate pid ${gate_pid} still alive after the check"
          exit "$status"
