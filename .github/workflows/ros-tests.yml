name: ROS tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build ROS 2 Jazzy image
        run: docker build --tag openamr-platform:test .
      - name: Build workspace and run focused package tests
        run: |
          docker run --rm openamr-platform:test bash -lc '
            cd /ros2_ws &&
            colcon build --symlink-install &&
            colcon test --packages-select openamrobot_docking openamrobot_perception \
              --event-handlers console_direct+ &&
            colcon test-result --verbose
          '
      - name: Enforce perception coverage
        run: |
          docker run --rm openamr-platform:test bash -lc '
            cd /ros2_ws &&
            python3 -m pytest src/openamrobot_perception/test/test_scan_body_filter.py \
              --cov=openamrobot_perception.scan_body_filter \
              --cov-report=term-missing \
              --cov-fail-under=70
          '
