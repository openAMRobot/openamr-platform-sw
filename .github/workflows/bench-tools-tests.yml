name: bench-tools-tests

# Text and argument checks for the read-only bench scripts in tools/bench. No device, robot,
# CAN bus or ROS graph is used; these checks do not exercise a LiDAR or a CAN interface.

on:
  pull_request:
    paths:
      - 'tools/bench/**'
      - '.github/workflows/bench-tools-tests.yml'
  push:
    branches: [main]
    paths:
      - 'tools/bench/**'
      - '.github/workflows/bench-tools-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench-tools-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out this repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-pytest

      - name: shellcheck
        run: shellcheck -x -P . tools/bench/*.sh

      - name: Run the read-only checks
        run: python3 -m pytest -v -p no:cacheprovider --junitxml=bench-tests.xml tools/bench/test

      # A missing or renamed test must not pass as an empty suite.
      - name: Check that all 31 tests ran
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('bench-tests.xml').getroot()
          suite = root if root.tag == 'testsuite' else root.find('testsuite')
          tests, skipped = int(suite.get('tests')), int(suite.get('skipped'))
          print(f'{tests} tests, {skipped} skipped')
          assert tests == 31 and skipped == 0, 'expected 31 bench tests, none skipped'
          PY
