
name: H-CI-1 Cold Hosted Build Test

on:
  pull_request:
    paths:
      - '.github/workflows/h-ci-1-cold-build.yml'
      - 'ros2/**'

  push:
    branches:
      - h-ci-1-devcontainer
    paths:
      - '.github/workflows/h-ci-1-cold-build.yml'
      - 'ros2/**'

permissions:
  contents: read
  packages: read

jobs:
  cold-build-test:
    name: Cold ROS 2 build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    container:
      image: ghcr.io/openamrobot/ci-ros2-jazzy@sha256:1653d4bdadce9999a48f73315e2da7aa667d3777579a97b0f1c12146667892d2
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout platform source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build ROS 2 packages
        shell: bash
        run: |
          set -eo pipefail

          source /opt/ros/jazzy/setup.bash
          set -u

          cd ros2
          colcon build --event-handlers console_direct+

      - name: Test ROS 2 packages
        shell: bash
        run: |
          set -eo pipefail

          source /opt/ros/jazzy/setup.bash
          cd ros2
          source install/setup.bash
          set -u

          colcon test --event-handlers console_direct+

          # Print test results and fail if any tests failed.
          colcon test-result --verbose

          python3 - <<'PY'
          import subprocess
          import sys

          result = subprocess.run(
              ["colcon", "test-result"],
              capture_output=True,
              text=True,
              check=False,
          )

          output = result.stdout + result.stderr
          print(output)

          if result.returncode != 0:
              sys.exit(result.returncode)

          # Colcon reports failures in its summary.
          # Treat any nonzero failed-test count as a CI failure.
          import re
          match = re.search(r"(\d+)\s+tests?\s+failed", output)
          if match and int(match.group(1)) > 0:
              sys.exit(1)

          if not match and "failures" in output.lower():
              sys.exit(1)
          PY
