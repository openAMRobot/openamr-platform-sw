# SPDX-License-Identifier: MIT
# Obstacle clearance trials (platform-sw #188, #190), scratch branch only. Each entry of
# ros2/src/openamrobot_clearance_trials/trial_matrix.json runs the scenarios once per repeat with a copy of
# nav2_params.yaml that carries the entry's overrides. The repository's nav2_params.yaml is not changed by this
# workflow. Simulation evidence only: never robot, site, physical or safety evidence. No secrets, no hardware.
name: clearance-trials

on:
  push:
    branches: ['diag/188-**']
    paths:
      - 'ros2/src/openamrobot_clearance_trials/**'
      - '.github/workflows/clearance-trials.yml'

permissions:
  contents: read

env:
  PKG_DIR: ros2/src/openamrobot_clearance_trials
  INTERFACES_REPO: openAMRobot/openamrobot-interfaces
  INTERFACES_REF: 50ed777be7990edbd3465f33fd97a158e7e3b88b
  ROS_APT_SOURCE_VERSION: '1.3.0'
  GZ_SIM_VENDOR: 0.0.13-1noble.20261031.125555
  GZ_TOOLS_VENDOR: 0.0.8-1noble.20261025.230735
  SDFORMAT_VENDOR: 0.0.14-1noble.20261031.120928
  GZ_SIM_VERSION: 8.15.0
  SDFORMAT_VERSION: 14.9.0

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - id: read
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          groups = json.load(open("ros2/src/openamrobot_clearance_trials/trial_matrix.json"))["groups"]
          print("matrix=" + json.dumps({"include": [{"index": i, "group": g["name"], "lidar_min": g["lidar_min"]}
                                                    for i, g in enumerate(groups)]}))
          PY
      - name: Static tests of the trial package
        run: |
          sudo apt-get update && sudo apt-get install -y python3-pytest python3-yaml
          cd "$PKG_DIR" && PYTHONPATH=. python3 -m pytest -v -p no:cacheprovider test/

  trials:
    needs: plan
    name: trials (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      CYCLONEDDS_URI: '<CycloneDDS><Domain Id="any"><Discovery><MaxAutoParticipantIndex>120</MaxAutoParticipantIndex></Discovery></Domain></CycloneDDS>'
      QT_QPA_PLATFORM: offscreen
    steps:
      # packages.ros.org delivered about 0.1 MB/s to these runners on 24 Nov 2026 (87 minutes of downloads per job).
      # The downloaded .deb files are kept in the Actions cache; apt still verifies each one against the signed index.
      - uses: actions/cache/restore@v4
        with:
          path: ~/apt-debs
          key: clearance-apt-debs-v1
      - name: "ENV: ROS 2 Jazzy from packages.ros.org (pinned ros2-apt-source)"
        run: |
          mkdir -p ~/apt-debs && ls ~/apt-debs | wc -l
          sudo cp -n ~/apt-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y curl locales software-properties-common
          sudo add-apt-repository -y universe
          curl --fail --location --retry 5 --retry-delay 5 -o /tmp/ros2-apt-source.deb \
            "https://github.com/ros-infrastructure/ros-apt-source/releases/download/${ROS_APT_SOURCE_VERSION}/ros2-apt-source_${ROS_APT_SOURCE_VERSION}.noble_all.deb"
          sudo dpkg -i /tmp/ros2-apt-source.deb
          sudo apt-get update
          sudo apt-get install -y ros-jazzy-ros-base python3-colcon-common-extensions python3-pytest python3-yaml

      - name: "ENV: pinned Gazebo vendor builds"
        run: |
          sudo apt-get install -y --allow-downgrades \
            ros-jazzy-gz-sim-vendor=${GZ_SIM_VENDOR} \
            ros-jazzy-gz-tools-vendor=${GZ_TOOLS_VENDOR} \
            ros-jazzy-sdformat-vendor=${SDFORMAT_VENDOR}
          sudo apt-mark hold ros-jazzy-gz-sim-vendor ros-jazzy-gz-tools-vendor ros-jazzy-sdformat-vendor

      - name: "ENV: the stack (Nav2, ros_gz, CycloneDDS)"
        run: |
          sudo apt-get install -y ros-jazzy-navigation2 ros-jazzy-nav2-bringup ros-jazzy-ros-gz \
            ros-jazzy-xacro ros-jazzy-robot-state-publisher ros-jazzy-joint-state-publisher \
            ros-jazzy-rmw-cyclonedds-cpp ros-jazzy-tf2-ros-py ros-jazzy-twist-mux

      - name: "ENV: keep the downloaded packages"
        run: |
          cp -n /var/cache/apt/archives/*.deb ~/apt-debs/ 2>/dev/null || true
          ls ~/apt-debs | wc -l; du -sh ~/apt-debs
      - uses: actions/cache/save@v4
        if: always()
        continue-on-error: true
        with:
          path: ~/apt-debs
          key: clearance-apt-debs-v1

      - name: "ENV: versions"
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          sim=$(gz sim --versions); sdf=$(gz sdf --versions)
          echo "gz sim ${sim}, gz sdf ${sdf}"
          dpkg-query -W -f='${Package} ${Version}\n' | grep -E '^ros-jazzy-(navigation2|nav2-(amcl|controller|bt-navigator|collision-monitor|dwb-controller|smac-planner|costmap-2d)|ros-gz-bridge|rmw-cyclonedds-cpp|gz-sim-vendor)( |$)' | sort | tee versions.txt
          test "${sim}" = "${GZ_SIM_VERSION}" && test "${sdf}" = "${SDFORMAT_VERSION}"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          path: ws/src/openamr-platform-sw
          persist-credentials: false

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ env.INTERFACES_REPO }}
          ref: ${{ env.INTERFACES_REF }}
          path: interfaces
          persist-credentials: false

      - name: "TEST PLANT: LiDAR range_min of this group (the repository value is 0.40)"
        working-directory: ws/src/openamr-platform-sw
        run: |
          f=ros2/src/openamrobot_description/urdf/gazebo_control.xacro
          test "$(grep -c '<min>0.40</min>' $f)" = 1
          sed -i 's|<min>0.40</min>|<min>${{ matrix.lidar_min }}</min>|' $f
          git diff --stat; grep -n -B3 -A2 '<min>${{ matrix.lidar_min }}</min>' $f

      - name: "BUILD: colcon build"
        shell: bash
        working-directory: ws
        run: |
          cp -r ../interfaces/ros2/openamr_nav_msgs src/
          source /opt/ros/jazzy/setup.bash
          colcon build --base-paths src --packages-up-to openamrobot_clearance_trials --event-handlers console_cohesion+
          git -C src/openamr-platform-sw rev-parse HEAD | tee ../head.txt

      - name: "RUN: every entry of the group, one after the other"
        shell: bash
        working-directory: ws
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          mkdir -p ../out
          echo "nproc $(nproc)"
          ros2 run openamrobot_clearance_trials clearance_scene /tmp/clearance_scene 1.5
          params=$(ros2 pkg prefix openamrobot_nav2)/share/openamrobot_nav2/config/nav2_params.yaml
          python3 - <<'PY'
          import json
          group = json.load(open("src/openamr-platform-sw/ros2/src/openamrobot_clearance_trials/trial_matrix.json"))["groups"][${{ matrix.index }}]
          for i, e in enumerate(group["entries"]):
              json.dump(e, open(f"/tmp/entry_{i}.json", "w"))
              open(f"/tmp/entry_{i}.overrides", "w").write(json.dumps(e.get("overrides", {})))
          open("/tmp/entries", "w").write(str(len(group["entries"])))
          PY
          rc_all=0
          for i in $(seq 0 $(( $(cat /tmp/entries) - 1 ))); do
            label=$(python3 -c "import json;print(json.load(open('/tmp/entry_$i.json'))['label'])")
            scenarios=$(python3 -c "import json;print(json.load(open('/tmp/entry_$i.json'))['scenarios'])")
            repeats=$(python3 -c "import json;print(json.load(open('/tmp/entry_$i.json')).get('repeats','1'))")
            echo "::group::ENTRY $i: $label"
            ros2 run openamrobot_clearance_trials clearance_overrides "$params" /tmp/nav2_params_$i.yaml "$(cat /tmp/entry_$i.overrides)" | tee ../out/overrides_$i.txt
            setsid ros2 launch openamrobot_clearance_trials clearance_sim.launch.py headless:=true \
              scene_dir:=/tmp/clearance_scene params_file:=/tmp/nav2_params_$i.yaml > ../out/launch_$i.log 2>&1 &
            launch_pid=$!
            set +e
            timeout 150m ros2 run openamrobot_clearance_trials clearance_trials --label "$label (LiDAR min ${{ matrix.lidar_min }})" \
              --scenarios "$scenarios" --repeats "$repeats" \
              --out ../out/clearance_trials_$i.json --markdown ../out/clearance_trials_$i.md
            rc=$?
            set -e
            echo "ENTRY $i trials exit status $rc"
            [ "$rc" = 0 ] || rc_all=1
            ros2 topic info -v /cmd_vel 2>/dev/null | grep -E "Node name|Publisher count" || true
            kill -INT -- -$launch_pid 2>/dev/null || true; sleep 8; kill -9 -- -$launch_pid 2>/dev/null || true
            pkill -9 -f "gz sim" 2>/dev/null || true; pkill -9 -f component_container 2>/dev/null || true
            ros2 daemon stop >/dev/null 2>&1 || true
            sleep 5
            echo "--- entry $i: inflation, collision_monitor and controller lines"
            grep -E "inflation radius|Robot to|Trajectory Hits Obstacle|No valid trajector|Failed to make progress|collision_monitor\]: \[" ../out/launch_$i.log | sed -E 's/\[[0-9.]+\] //' | cut -c1-170 | sort | uniq -c | sort -rn | head -25 || true
            echo "::endgroup::"
            { echo "### $label (LiDAR min ${{ matrix.lidar_min }})"; cat ../out/overrides_$i.txt; cat ../out/clearance_trials_$i.md 2>/dev/null || echo "no result table"; } >> "$GITHUB_STEP_SUMMARY"
          done
          echo "TRIALS_RC=$rc_all" >> "$GITHUB_ENV"
          exit 0

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: clearance-trials-${{ strategy.job-index }}
          path: |
            out/
            versions.txt
            head.txt

      - name: Verdict (contacts and expected outcomes; the 0.10 m target is reported, not enforced)
        run: test "${TRIALS_RC:-1}" = "0"
