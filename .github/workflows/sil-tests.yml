name: sil-tests

# Base and lift software-in-the-loop on Linux virtual CAN (openamrobot_sil).
# Development evidence only: emulators and Gazebo, no hardware. The Renode jobs run the
# openamr-platform-fw telemetry image (pinned commit; presets RenodeTest and
# TelemetryUrosSerialSimBench, the latter with a micro-ROS agent built from pinned commits) in
# Renode 1.16.1 (pinned tarball and SHA-256) on vcan_drive, vcan_bms and vcan_aux: firmware in the
# loop for telemetry only, read-only on all three buses.
#
# The vcan kernel module is loaded on the runner. ROS 2 Jazzy and Gazebo Harmonic run in the
# ros:jazzy-ros-base image with the host network, so the container sees the vcan interfaces.
# If vcan cannot be loaded the job FAILS with a BLOCKED line. Blocked is not a pass.

on:
  pull_request:
    paths:
      - 'ros2/src/openamrobot_sil/**'
      - 'ros2/src/openamrobot_description/urdf/**'
      - '.github/workflows/sil-tests.yml'
  push:
    branches: [main]
    paths:
      - 'ros2/src/openamrobot_sil/**'
      - 'ros2/src/openamrobot_description/urdf/**'
      - '.github/workflows/sil-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SIL_IMAGE: ros:jazzy-ros-base
  SIL: docker exec sil bash -eo pipefail -c
  # Same ARM toolchain pins as openamr-platform-fw firmware-nightly.yml (APT_ARM) at the
  # pinned firmware commit, plus the build and Renode run-time packages.
  APT_FW: >-
    gcc-arm-none-eabi=15:13.2.rel1-2 binutils-arm-none-eabi=2.42-1ubuntu1+23
    libnewlib-arm-none-eabi=4.4.0.20231231-2 ninja-build cmake git curl ca-certificates libicu74
    libstdc++-arm-none-eabi-newlib=15:13.2.rel1-2+26 python3-catkin-pkg python3-empy python3-lark

jobs:
  sil-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out this repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Load the vcan module (BLOCKED if unavailable)
        run: |
          if ! sudo modprobe vcan 2>/dev/null; then
            sudo apt-get update
            sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true
          fi
          if ! sudo modprobe vcan || ! sudo modprobe can_raw; then
            echo "BLOCKED: the vcan or can_raw kernel module is not available on this runner ($(uname -r))"
            echo "::error::BLOCKED: vcan unavailable. No SIL test ran. This is not a pass."
            exit 1
          fi
          sudo ip link add dev vcan_siltest type vcan
          sudo ip link set up vcan_siltest
          ip -br link show type vcan

      - name: Start the ROS 2 Jazzy container on the host network
        run: |
          docker run -d --name sil --network host --cap-add NET_ADMIN \
            -e APT_FW="$APT_FW" -v "$PWD":/repo -w /repo "$SIL_IMAGE" sleep infinity
          $SIL 'apt-get update && apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions python3-pytest python3-yaml python3-can iproute2 procps \
            ros-jazzy-xacro ros-jazzy-robot-state-publisher ros-jazzy-nav-msgs \
            ros-jazzy-ros-gz-sim ros-jazzy-ros-gz-bridge $APT_FW'
          $SIL 'ip -br link show type vcan && python3 -c "import can; print(\"python-can\", can.__version__)"'

      - name: Build openamrobot_description and openamrobot_sil
        run: |
          $SIL 'source /opt/ros/jazzy/setup.bash && cd ros2 && \
            colcon build --symlink-install --packages-up-to openamrobot_sil'

      # The two vendored openamr-platform-fw test files, unmodified, on vcan.
      - name: Vendored platform-fw emulator tests on vcan
        run: |
          $SIL 'cd ros2/src/openamrobot_sil/openamrobot_sil/vendor/can_sil/tests && \
            CAN_SIL_IFACE=vcan_siltest python3 -m pytest -v -p no:cacheprovider \
              --junitxml=/repo/sil-vendored.xml test_zlac8015d.py test_ctl017.py'

      - name: SIL protocol tests on vcan
        run: |
          $SIL 'source /opt/ros/jazzy/setup.bash && source ros2/install/setup.bash && \
            SIL_TEST_BUS=vcan SIL_TEST_IFACE=vcan_siltest python3 -m pytest -v -p no:cacheprovider \
              --junitxml=/repo/sil-protocol.xml ros2/src/openamrobot_sil/test'

      # sil.launch.py creates vcan_drive, vcan_bms and vcan_aux itself (NET_ADMIN).
      - name: End-to-end tests with Gazebo and the host test client
        run: |
          $SIL 'source /opt/ros/jazzy/setup.bash && source ros2/install/setup.bash && \
            SIL_LAUNCH_LOG=/repo/sil-launch.log python3 -m pytest -v -p no:cacheprovider \
              --junitxml=/repo/sil-gazebo.xml ros2/src/openamrobot_sil/test_integration/test_sil_gazebo.py'

      # openamr-platform-fw is fetched at the pinned commit and built, nothing in it is changed.
      - name: Build the firmware images (platform-fw pinned commit, RenodeTest, Debug, TelemetryUrosSerialSimBench), the micro-ROS agent, and fetch Renode
        run: |
          $SIL 'source /opt/ros/jazzy/setup.bash && \
            bash ros2/src/openamrobot_sil/scripts/sil_renode_firmware.sh --default-too --uros /repo/.sil-renode'
          {
            echo "### Firmware in the loop (telemetry image)"
            echo
            echo '```'
            cat .sil-renode/sil_renode.env
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Renode only: the image on a Renode CAN hub with nothing else on it. No vcan, no Gazebo.
      - name: Renode tests of the firmware node, console and micro-ROS (banner or status, reset, fresh start, refused default build, agent, time ratio)
        run: |
          $SIL 'source /opt/ros/jazzy/setup.bash && source ros2/install/setup.bash && \
            set -a && . /repo/.sil-renode/sil_renode.env && set +a && \
            cd ros2/src/openamrobot_sil/test_renode && \
            python3 -m pytest -v -s -p no:cacheprovider --junitxml=/repo/sil-renode-node.xml \
              test_renode_node.py test_renode_uros_node.py'

      # stm32:=renode_readonly: the micro-ROS image on vcan_drive, vcan_bms and vcan_aux through
      # Renode's SocketCAN bridges, its agent on USART3, Gazebo.
      - name: End-to-end tests with Gazebo and the firmware image in Renode
        run: |
          $SIL 'source /opt/ros/jazzy/setup.bash && source ros2/install/setup.bash && \
            set -a && . /repo/.sil-renode/sil_renode.env && set +a && \
            SIL_RENODE_LAUNCH_LOG=/repo/sil-renode-launch.log \
            SIL_DRIVE_CAPTURE=/repo/sil-vcan_drive.log python3 -m pytest -v -s -p no:cacheprovider \
              --junitxml=/repo/sil-renode.xml ros2/src/openamrobot_sil/test_integration/test_sil_renode.py'

      - name: Show the launch logs
        if: always()
        run: |
          ip -br link show type vcan || true
          tail -n 300 sil-launch.log || true
          echo "---- renode_readonly launch"
          tail -n 300 sil-renode-launch.log || true
          docker exec sil sh -c 'for f in /tmp/openamrobot_sil_renode*/renode-*.log /tmp/openamrobot_sil_renode*/agent-*.log; do
            echo "---- $f"; tail -n 60 "$f"; done' || true

      - name: Upload the drive bus capture and the Renode logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sil-renode-evidence
          path: |
            sil-vcan_drive.log
            sil-renode-launch.log
            sil-*.xml
            .sil-renode/sil_renode.env
          retention-days: 30
          if-no-files-found: warn

      # A missing, renamed or skipped test must not pass as a smaller suite.
      - name: Check test counts
        run: |
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET
          expected = {'sil-vendored.xml': 36, 'sil-protocol.xml': 104, 'sil-gazebo.xml': 4,
                      'sil-renode-node.xml': 14, 'sil-renode.xml': 12}
          for name, want in expected.items():
              root = ET.parse(name).getroot()
              suite = root if root.tag == 'testsuite' else root.find('testsuite')
              tests, skipped = int(suite.get('tests')), int(suite.get('skipped'))
              failed = int(suite.get('failures')) + int(suite.get('errors'))
              print(f'{name}: {tests} tests, {skipped} skipped, {failed} failed')
              assert tests == want and skipped == 0 and failed == 0, f'{name}: expected {want}, none skipped'
          EOF
