name: snapshot-probe

# Temporary probe, removed before review: lists the Jazzy snapshots on snapshots.ros.org and
# which of them hold the Gazebo vendor builds that description-gazebo-tests pins.

on:
  pull_request:
    paths:
      - '.github/workflows/snapshot-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    steps:
      - name: Probe snapshots.ros.org
        shell: bash
        run: |
          apt-get update -qq && apt-get install -y -qq curl ca-certificates gnupg >/dev/null
          curl -fsS http://snapshots.ros.org/jazzy/ | grep -o 'href="[^"]*"' | sort -u
          curl -fsS 'https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x4B63CF8FDE49746E98FA01DDAD19BAB3CBF125EA' \
            | gpg --show-keys --with-fingerprint || true
          for d in $(curl -fsS http://snapshots.ros.org/jazzy/ | grep -o 'href="20[0-9-]*/"' | grep -o '20[0-9-]*' | sort -u); do
            p=$(curl -fsS "http://snapshots.ros.org/jazzy/${d}/ubuntu/dists/noble/main/binary-amd64/Packages.gz" 2>/dev/null | gunzip -c 2>/dev/null)
            echo "== ${d} bytes=${#p}"
            for pkg in ros-jazzy-gz-sim-vendor ros-jazzy-gz-tools-vendor ros-jazzy-sdformat-vendor ros-jazzy-gz-math-vendor ros-jazzy-xacro ros-jazzy-ros-base; do
              printf '%s ' "${pkg}"; printf '%s\n' "${p}" | awk -v k="Package: ${pkg}" '$0==k{f=1;next} f&&/^Version:/{print $2; f=0}' | tr '\n' ' '; echo
            done
          done
          echo "== packages.ros.org main now"
          curl -fsS http://packages.ros.org/ros2/ubuntu/dists/noble/main/binary-amd64/Packages.gz | gunzip -c \
            | awk '/^Package: ros-jazzy-(gz-sim|gz-tools|sdformat)-vendor$/{f=1;print;next} f&&/^Version:/{print;f=0}'
