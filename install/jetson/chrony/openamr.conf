# /etc/chrony/conf.d/openamr.conf: clock policy for the Jetson, the MCU and the tablet.
#
# Why: stamped commands (TwistStamped, UI velocity contract, issue #110) and the Nav2 and
# TF time checks compare stamps with the receiver's clock. A tablet or MCU with a skewed
# clock gets its commands dropped or its data rejected. Policy:
#
#   1. The Jetson is the time master on the robot network. It disciplines itself from an
#      upstream NTP source when one is reachable, and serves the robot network.
#   2. Without upstream (the normal case in a hall without internet) the Jetson keeps its
#      own clock (local stratum) and serves it, so tablet and robot agree with each other.
#      Absolute wall time is then only as good as the last sync; agreement matters here.
#   3. The tablet (Getac) uses the Jetson as its only NTP server. It never sends stamps to
#      the robot that are based on a different clock source.
#   4. The MCU does not run NTP. micro-ROS agent time sync (rmw_uros_sync_session, repeated
#      on reconnect) maps the MCU clock to the Jetson clock. The MCU is therefore always
#      measured against the Jetson, never against the tablet.
#   5. Target offset between Jetson and tablet: below 5 ms (readiness review T0 check).
#      Check with: chronyc tracking ; chronyc clients
#
# TODO(Karthikeyan): set the robot network subnet in "allow", and the upstream servers that
# the site allows. The values below are placeholders from private address space.

# Upstream pool, used only when reachable. iburst for a fast first sync after boot.
pool ntp.ubuntu.com iburst maxsources 4

# Serve the robot network. TODO(Karthikeyan): replace with the real tablet subnet.
allow 192.168.0.0/24

# No upstream: stay a server with the local clock (stratum 10 is above any real source).
local stratum 10 orphan

# Step the clock at boot if it is more than 1 s off, in the first 3 updates only. After
# that the clock is only slewed, so running stacks never see time jump.
makestep 1.0 3

# Keep the hardware clock in step, if the carrier has one (TODO(Karthikeyan): confirm).
rtcsync

# Log offsets for the evidence pack.
logdir /var/log/chrony
log tracking measurements statistics
