        unless: '\baway\b|\bnot\b|never|supersed|historical|legacy'
        message: imu_link sits on the centreline away from motor magnetic fields (P-03 rev18.7 item 15)
    verification:
      machine: base_link placed on the floor, base_footprint at axle height, or imu_link next to a motor
