# Never scanned: this register, checker fixtures, change logs and the Watchdog guide
# (WATCHDOG.md quotes findings and its accepted-words table is generated from this register).
exclude:
  - decisions.yaml
  - WATCHDOG.md
  - tests/fixtures/**
  - "**/CHANGELOG.md"
  - agent-runs.md

decisions:
  - id: BOM-ISSUE-IN-FORCE
    title: Canonical hardware BOM issue for OpenAMRobot 2.0
    summary: "BOM Issue 7.10 is the canonical OpenAMRobot 2.0 hardware BOM."
    fix_hint: "Name Issue 7.10 as canonical, or label older issues (Issue 6, Issue 7 to 7.9, B-01) as superseded or earlier."
    kind: value
    status: recorded
    value: OpenAMRobot 2.0 Detailed Hardware BOM, Issue 7.10
    unit: none
    date: 2026-10-18
    review_by: 2026-11-29
    source: {document: P-03-rev19.6, item: "BOM issue in force (BOM Issue 7.10)"}
    supersedes:
      - {value: Issue 7.8, source: "P-03-rev19.2 BOM issue in force (BOM Issue 7.8)"}
      - {value: Issue 7.7, source: "P-03-rev19.0 BOM issue in force (BOM Issue 7.7)"}
      - {value: Issue 7.6, source: "P-03-rev18.9 item 16 (BOM Issue 7.6 carries the change)"}
      - {value: Issue 7.3, source: P-03-rev18.7 BOM issue in force}
      - {value: Issue 7, source: P-03-rev18.2 item 7}
      - value: Issue 6, or an explicitly approved successor
        source: P-03-rev18.1 line 7
        citation: '(?P<found>P-03[^\n]{0,30}(?:rev(?:ision)?\.?\s*)?18\.1[^\n]{0,30}line\s*7)'
      - {value: B-01 development BOM and evidence register rev18, source: P-03-rev18.1 line 7}
    applies_to: {repositories: ["*"], files: ["**/*.md", "**/*.html", "**/*.yaml", "**/*.yml"]}
    check:
      - pattern: '(?P<found>(?:canonical|in force|of record)[^\n]{0,40}\bIssue\s*6\b|\bIssue\s*6\b[^\n]{0,40}\b(?:canonical|in force|of record))'
        unless: 'supersed|replaced|previous|earlier'
        message: BOM Issue 7.10 is the canonical hardware BOM (P-03 rev19.6)
      - pattern: '(?P<found>B-01[^\n]{0,60}\b(?:canonical|current))'
        unless: 'supersed'
        message: B-01 is superseded
      - pattern: '(?P<found>(?:canonical|in force|of record)[^\n]{0,40}\bIssue\s*7(?!\.10\b)(?:\.\d+)?\b|\bIssue\s*7(?!\.10\b)(?:\.\d+)?\b[^\n]{0,40}\b(?:canonical|in force|of record))'
        unless: 'supersed|replaced|previous|earlier|historical'
        message: BOM Issue 7.10 is the canonical hardware BOM (P-03 rev19.6)
    verification:
      machine: Issue 6, Issue 7 to 7.9 or B-01 presented as the canonical BOM; citations of P-03 rev18.1 line 7
      human: {reviewer: platform-lead, evidence: the BOM file header and issue number in the released BOM}
    owner: platform-lead

  - id: MAST-INSTALL-HEIGHT
    title: Shoulder-axis installation height of the fixed mast (superseded by LIFT)
    summary: "Superseded: the fixed-mast 1350 mm installation height was replaced by LIFT."
    fix_hint: "Describe the lift (shoulder axis 1000 to 1350 mm), or label the fixed-mast text as superseded or historical."
    kind: configuration
    status: superseded
    value: 1350
    unit: mm
    configuration_id: mast_1350
    date: 2026-09-28
    review_by: 2026-11-09
    source: {document: P-03-rev18.2, item: shoulder height}
    supersedes:
      - value: 1400
        configuration_id: mast_1400
        source: P-03-rev18.1 item 6 line 15
        citation: '(?P<found>P-03[^\n]{0,30}(?:rev(?:ision)?\.?\s*)?18\.1[^\n]{0,30}item\s*6)'
      - {value: 1300, configuration_id: mast_1300, source: working baseline before P-03-rev18.1 item 6}
    applies_to:
      repositories: ["*"]
      files: ["**/*.md", "**/*.yaml", "**/*.yml", "**/*.xacro", "**/*.urdf", "**/*.launch.py", "**/package.xml", "**/*.html"]
    superseded_by:
      document: P-03-rev18.7
      item: item 8
      decision: LIFT
      citation: '(?P<found>\bmast_1350\b[^\n]{0,60}\b(?:baseline|installation)|(?:shoulder[- ]axis|installation) height\s*(?:at|of|is|:)?\s*1350\s*mm)'
      unless: 'supersed|legacy|historical|earlier|previous|rev ?18\.[1-6]\b|\blift\b|L1350|extended|full stroke'
    verification:
      machine: text still presenting the superseded fixed-mast value as current (citation pattern)
      human: {reviewer: platform-lead, evidence: URDF/Xacro mast configuration and the general arrangement drawing at 1350 mm}
    owner: platform-lead

  - id: MAST-POSITIONS
    title: Indexed mast mounting positions (superseded by LIFT)
    summary: "Superseded: the indexed fixed-mast positions were replaced by LIFT."
    fix_hint: "Describe the lift positions, or label mast_1300/1400/1450 text as superseded or historical."
    kind: configuration
    status: superseded
    values: [1300, 1350, 1400, 1450]
    unit: mm
    step_mm: 50
    date: 2026-09-28
    review_by: 2026-11-09
    source: {document: P-03-rev18.2, item: shoulder height}
    supersedes:
      - {value: nine positions 1300 to 1700 mm (mast_1300 to mast_1700), source: P-00-rev18.1 txt 293-294}
    applies_to:
      repositories: ["*"]
      files: ["**/*.md", "**/*.yaml", "**/*.yml", "**/*.xacro", "**/*.urdf", "**/*.launch.py", "**/*.html"]
    superseded_by:
      document: P-03-rev18.7
      item: item 8
      decision: LIFT
      citation: '(?P<found>\bmast_1(?:300|400|450)\b|\b(?:four|4) indexed (?:mast )?(?:mounting )?positions|\bindexed mast (?:mounting )?positions)'
      unless: 'supersed|legacy|historical|earlier|previous|rev ?18\.[1-6]\b'
    verification:
      machine: text still presenting the superseded fixed-mast value as current (citation pattern)
      human: {reviewer: platform-lead, evidence: mast drawing with index holes}
    owner: platform-lead

  - id: MAST-TOP-HEIGHT
    title: Mast top height above the floor (own COTS mast, one MISUMI HFS6-60120 profile; superseded by LIFT)
    summary: "Superseded: the 1500 mm mast top on an HFS6-60120 profile was replaced by LIFT."
    fix_hint: "Describe the lift; HFS6-60120 is now the short arm profile on the lift (ARM-MOUNT), not a mast."
    kind: value
    status: superseded
    value: 1500
    unit: mm
    date: 2026-09-28
    review_by: 2026-11-09
    source: {document: P-03-rev18.2, item: mast}
    supersedes:
      - {value: 1554, source: general arrangement before 28 September 2026}
    applies_to:
      repositories: ["*"]
      files: ["**/*.md", "**/*.yaml", "**/*.yml", "**/*.html", "**/*.xacro", "**/*.urdf"]
    superseded_by:
      document: P-03-rev18.7
      item: item 8
      decision: LIFT
      citation: '(?P<found>\bmast top[^\n]{0,20}\b1500\s*mm|\bHFS6-60120\b[^\n]{0,60}\b(?:mast|centre bracket|center bracket)\b)'
      unless: 'supersed|legacy|historical|earlier|previous|rev ?18\.[1-6]\b'
    verification:
      machine: text still presenting the superseded fixed-mast value as current (citation pattern)
      human: {reviewer: platform-lead, evidence: mast drawing and CAD}
    owner: platform-lead

  - id: MAX-ASSEMBLED-HEIGHT
    title: 1700 mm is the maximum assembled-height envelope, not a shoulder-axis height
    summary: "1700 mm is the maximum assembled-height envelope, not a shoulder height."
    fix_hint: "Use 1700 mm only as the assembled-height envelope; give shoulder heights from the LIFT entry."
    kind: distinction
    status: recorded
    value: 1700
    unit: mm
    date: null
    review_by: 2026-11-18  # six weeks after this register update (2026-10-07)
    source: {document: P-03-rev18.7, item: item 8}
    note: First recorded in P-03-rev18.1 item 6 line 15 and repeated in rev18.2; kept unchanged by rev18.7 item 8 with the lift. The robot may be lower, never higher.
    applies_to:
      repositories: ["*"]
      files: ["**/*.md", "**/*.yaml", "**/*.yml", "**/*.html", "**/*.xacro", "**/*.urdf"]
    check:
      - pattern: '(?P<found>max(?:imum)?\s+(?:assembled\s+|robot\s+)?height\s*(?:of|is|:)?\s*(?!1700)1\d{3}\s*mm)'
        message: maximum assembled height is 1700 mm
      - pattern: '(?P<found>(?:shoulder[- ]axis|shoulder height|mast_)[^\n]{0,20}\b1700\b)'
        unless: 'max|envelope|not (?:the )?shoulder|higher|supersed'
        message: 1700 mm is the assembled-height envelope, not a shoulder height or mast position
    verification:
      machine: another maximum-height value, or 1700 mm presented as a shoulder height or mast position
      human: {reviewer: platform-lead, evidence: assembled-height measurement on the general arrangement}
    owner: platform-lead

  - id: DATUM-HEIGHT-STACK
    title: Height datum and base height stack
    summary: "Floor Z = 0; steel deck top 294 mm; lift base-plate top face 304 mm is the height reference."
    fix_hint: "Use 294 mm for the deck top and 304 mm for the base-plate top face, or label old values as historical."
    kind: configuration
    status: recorded
    values:
      - floor Z = 0
      - steel chassis deck top 294 mm (MMP STEP)
      - top cover 2 mm plastic, or optional 0.5 to 0.8 mm sheet metal
      - 10 mm aluminium lift base plate bears on the steel deck; the cover is cut out around it
      - base-plate top face 304 mm is the reference for lift and shoulder heights
    unit: mm
    date: 2026-10-06
    review_by: 2026-11-17
    source: {document: P-03-rev18.7, item: item 15}
    applies_to: {repositories: ["*"], files: ["**/*.md", "**/*.yaml", "**/*.yml", "**/*.html", "**/*.xacro", "**/*.urdf"]}
    check:
      - pattern: '(?P<found>\bdeck top\b[^\n]{0,25}?\b(?!294\b)\d{3}\s*mm)'
        unless: 'supersed|historical|legacy|earlier|previous'
        message: the steel chassis deck top is 294 mm above the floor (P-03 rev18.7 item 15)
      - pattern: '(?P<found>\bbase[- ]plate top(?: face)?\b\s*(?:is\s*|at\s*|of\s*|=\s*|:\s*)?(?:z\s*=?\s*)?(?!304\b)\d{3}\s*mm)'
        unless: 'supersed|historical|legacy|earlier|previous'
        message: the lift base-plate top face is 304 mm above the floor, the reference for lift and shoulder heights (P-03 rev18.7 item 15)
    verification:
      machine: a deck-top height other than 294 mm or a base-plate top face other than 304 mm
      human: {reviewer: platform-lead, evidence: MMP STEP deck height and the lift base-plate drawing}
    owner: platform-lead

  - id: FRAMES-REP105
    title: Base frames follow REP 105
    summary: "REP 105: base_footprint on the floor, base_link at the axle midpoint, imu_link away from motors."
    fix_hint: "Place base_footprint on the floor, base_link at axle height, and imu_link on the centreline away from motors."
    kind: configuration
    status: recorded
    values:
      - base_footprint on the floor under the drive-axle midpoint
      - base_link at the drive-axle midpoint and axle height; x forward, z up
      - base_link 0.098 m above the floor (axle height; moved here from CAMERAS on 20 Oct 2026, value unchanged, P-03 rev19.4 item 19 D3)
      - imu_link on the centreline, away from motor magnetic fields
      - "imu_link (0.0544, 0, 0.1210) m from base_link, rpy (0, 0, -pi/2), yaw -90 deg: ICM-42688-P on MIKROE-4237 on the electronics bracket MMP.04.00.00.002, centreline, 54.4 mm ahead of the drive axle, chip centre 165.043 mm above the base-plate top, 219.04 mm above the floor"
      - "the IMU publishes raw sensor-frame values; the axis mapping is in the URDF (sensor X to base -y, Y to +x, Z to +z); no firmware remap"
    unit: none
    date: 2026-10-16
    review_by: 2026-11-27
    source: {document: P-03-rev19.4, item: "item 19 D5 update (Alex decision 16 Oct 2026, platform-sw #70)"}
    supersedes:
      - {value: "(0.0544, 0, 0.133), rpy 0", source: "measured against a displaced base plate in the CAD; superseded by Alex decision 16 Oct 2026 (platform-sw #70)"}
      - {value: "(0.195, 0, -0.044) plus board stack", source: "Alex decision 12 Oct 2026, superseded by Alex decision 16 Oct 2026 (CAD Rev B, platform-hw #20)"}
    applies_to: {repositories: ["*"], files: ["**/*.md", "**/*.yaml", "**/*.yml", "**/*.html", "**/*.xacro", "**/*.urdf", "**/*.launch.py"]}
    check:
      - pattern: '(?P<found>\bbase_link\b[^\n]{0,30}\b(?:on|at) the floor\b)'
        unless: 'base_footprint|\bnot\b|never|supersed|historical|legacy'
        message: base_link is at the drive-axle midpoint and axle height; base_footprint is on the floor (P-03 rev18.7 item 15)
      - pattern: '(?P<found>\bbase_footprint\b[^\n]{0,30}\bat (?:the )?axle height\b)'
        unless: '\bnot\b|never|supersed|historical|legacy'
        message: base_footprint is on the floor under the drive-axle midpoint (P-03 rev18.7 item 15)
