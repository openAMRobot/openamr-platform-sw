    fix_hint: "Use column, base_plate, head_pitch and base_tilt IDs; the lift height is joint state, not a configuration ID."
    kind: configuration
    status: recorded
    values:
      - column dold_v4_350 or tl3_400
      - base_plate bp000 or bp050
      - head_pitch hp15, hp20, hp25, hp30, hp35 (baseline hp30)
      - base_tilt bt05, bt10, bt15 (baseline bt10)
      - lift stops L1000, L1175, L1350 are calibration IDs; the lift height is joint state
    unit: none
    date: 2026-10-28
    review_by: 2026-12-09
    source: {document: P-03-rev20.0, item: "item 17 (28 Oct 2026 corrections: head_pitch baseline hp30); column, base_plate and base_tilt per P-03-rev18.9 items 17 and 18"}
    supersedes:
      - {value: "head_pitch hp15, hp20, hp25, hp30, hp35 (baseline hp25)", source: P-03-rev18.9 item 17}
      - {value: "mast_id (mast_1300 to mast_1450)", source: P-03-rev18.2 shoulder height}
    applies_to: {repositories: ["openamr-*", "openamrobot-*"], files: ["**/*.md", "**/*.yaml", "**/*.yml", "**/*.xacro", "**/*.urdf", "**/*.launch.py", "**/*.py"]}
    check:
