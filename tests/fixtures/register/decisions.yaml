    summary: "Navigation LiDAR: SLAMTEC RPLIDAR S3 (S3M1-R2) on USB, regulated 5 V rail."
    fix_hint: "Name the RPLIDAR S3; label Hokuyo as dropped or superseded and the A1 as legacy (existing robot)."
    kind: value
    status: recorded
    values:
      - SLAMTEC RPLIDAR S3 (S3M1-R2), connected over USB, powered from the regulated 5 V rail (functional sensing, not a safety device)
      - mounted on the existing MMP.07 bracket with a 17.5 mm printed spacer MMP.07.00.00.002 and no standoffs; scan plane 222.05 mm above the floor; lidar_link (0.330, 0, 0.124) from base_link, yaw pi
      - "body filter: openamrobot_perception scan_body_filter with scan_body_filter_real.yaml from v0.0.1, unchanged (side posts at 82.9 to 89.5 degrees in the LiDAR frame lie inside its close-mask sectors)"
    unit: none
    backup: RPLIDAR S2E, only if the S3 is unavailable
    date: 2026-10-16
    review_by: 2026-11-27
    source: {document: P-03-rev19.4, item: "item 19 D4 update (Alex decision 16 Oct 2026)"}
    supersedes:
      - {value: "MMP.07 bracket and 10 mm standoffs with a 7.1 mm spacer plate; scan plane 222.0 mm above the floor", source: "Alex decision 12 Oct 2026, superseded by Alex decision 16 Oct 2026 (CAD Rev B, platform-hw #20)"}
      - {value: Hokuyo UST-10LX, source: P-03-rev18.3 item 11 (dropped on cost)}
      - {value: RPLIDAR A1, source: existing robot (Gate A)}
    applies_to:
      repositories: ["openamr-platform-*", "openamrobot-docs", "openamrobot-release"]
      files: ["**/*.md", "**/*.yaml", "**/*.yml", "**/*.launch.py", "**/package.xml", "**/*.html", "**/*.xacro", "**/*.urdf"]
    check:
      - pattern: '(?P<found>\bHokuyo\b|\bUST-10LX\b)'
        unless: 'supersed|dropped|legacy|historical'
        message: the 2.0 navigation LiDAR is the RPLIDAR S3 (S3M1-R2); the Hokuyo UST-10LX was dropped
      - pattern: '(?P<found>\bRPLIDAR A1(?:M8)?\b|\bA1M8\b)'
        unless: 'legacy|Gate A|existing robot|historical|replaced'
        message: the 2.0 navigation LiDAR is the RPLIDAR S3 (S3M1-R2); label RPLIDAR A1 material as legacy (Gate A)
      - pattern: '(?P<found>\b0\.335\b[^\n]{0,40}?\b0\.18)'
        unless: 'legacy|Gate A|supersed|historical'
        message: lidar_link is (0.330, 0, 0.124) from base_link, yaw pi, on the MMP.07 bracket with the 17.5 mm printed spacer (Alex decision 2026-10-16)
    verification:
      machine: Hokuyo or UST-10LX without a superseded or legacy label; RPLIDAR A1 or A1M8 without a legacy label; a lidar_link pose of 0.335 followed by 0.18 without a legacy label
      human: {reviewer: software-lead, evidence: bring-up launch and scan topic from the sllidar_ros2 driver with the RPLIDAR S3}
    owner: robot-description-owner

  - id: RELEASE-MILESTONES
    title: OpenAMRobot 2.0 release milestones
    summary: "v2.0.0-rc.1 on 20 November 2026; v2.0.0 final release on 18 December 2026."
    fix_hint: "Use 20 November (v2.0.0-rc.1) and 18 December 2026 (v2.0.0); label v0.2 or 13 November as superseded."
    kind: value
    status: recorded
    values:
      - "20 November 2026: OpenAMRobot 2.0 pre-release, version v2.0.0-rc.1 (GitHub pre-release; full readiness, frozen platform baseline, end of development cycle 2)"
      - "23 November to 18 December 2026: physical integration, testing and acceptance"
      - "18 December 2026: OpenAMRobot 2.0 final release, version v2.0.0"
    unit: none
    date: 2026-10-01
    review_by: 2026-11-12
    source: {document: P-03-rev18.6, item: item 12}
    applies_to: {repositories: ["*"], files: ["**/*.md", "**/*.html", "**/*.yaml", "**/*.yml"]}
    check:
      # The schema requires at least one check: a 2.0 final release given another date.
      - pattern: '(?P<found>2\.0 final release[^\n]{0,20}?\b(?!18 December 2026)\d{1,2} (?:January|February|March|April|May|June|July|August|September|October|November|December) \d{4})'
        unless: 'supersed|previous|earlier|historical'
        message: the OpenAMRobot 2.0 final release is 18 December 2026
      - pattern: '(?P<found>\bv0\.2\b[^\n]{0,40}\brelease\b|\brelease\b[^\n]{0,20}\bv0\.2\b|\breadiness declaration for v0\.2\b)'
        unless: 'supersed|historical|earlier|previous'
        message: there is no v0.2 release; development cycle 2 ends 20 November 2026 with v2.0.0-rc.1, and v2.0.0 follows on 18 December 2026
      - pattern: '(?P<found>\bcycle\b[^\n]{0,60}\b13 November(?: 2026)?\b|\b13 November(?: 2026)?\b[^\n]{0,60}\bcycle\b)'
        unless: 'supersed|historical|earlier|previous'
        message: development cycle 2 ends 20 November 2026 with v2.0.0-rc.1, not 13 November
    verification:
      machine: text giving the 2.0 final release a date other than 18 December 2026; a v0.2 release or a development cycle ending 13 November 2026 without a superseded label
      human: {reviewer: platform-lead, evidence: the release plan and versions in P-03 rev18.6 item 12}
    owner: platform-lead

  - id: LIFT
    title: Lift approved in principle for OpenAMRobot 2.0
    summary: "Lift approved in principle: DOLD Hexalift V4 350 mm, shoulder 1000 to 1350 mm, base plate centre or +50 mm."
    fix_hint: "Describe the DOLD V4 lift on a two-position base plate; label V1, five positions and fixed-mast text as superseded."
    kind: configuration
    status: recorded
    values:
      - lift approved in principle
      - DOLD Hexalift V4 350 mm (800 N push, 18 mm/s, order code BS-HM240G350530-MFF24) primary; TiMOTION TL3 400 mm fallback
      - column 530 mm retracted, 880 mm extended, mounted with its 240 mm side fore-aft
      - shoulder 1000 to 1350 mm (304 + 530 or 880 + 166 mm), see ARM-MOUNT
      - lift base plate fore-aft positions centre and +50 mm (bp000, bp050)
      - lift motion only in the stowed or carry safe pose with the base stopped
      - hold-and-move limits 0.05 m/s (drawer reversal) and 0.3 m/s (carrying)
      - "release gates: written DOLD holding on E-stop and power loss, supplier CAD, weighed mass, the CAN3 lift interface and the F2S rerun"
    unit: none
    date: 2026-10-09
    review_by: 2026-11-20
    source: {document: P-03-rev18.9, item: "items 16 and 18; motion rules item 15; release gates items 6, 8, 14, 15, 16"}
    supersedes:
      - {value: "Lift removed from OpenAMRobot 2.0; fixed mast; lift on the 3.0 roadmap (former entry LIFT-REMOVED)", source: P-00-rev18.1 txt 18}
      - {value: "DOLD Hexalift V1 350 mm primary", source: P-03-rev18.7 item 15}
      - {value: "base plate positions centre, +50, +100, +150 and +200 mm", source: P-03-rev18.7 item 15}
    applies_to: {repositories: ["*"], files: ["**/*.md", "**/*.yaml", "**/*.yml", "**/*.html", "**/package.xml", "**/*.xacro", "**/*.urdf"]}
    check:
      - pattern: '(?P<found>\bno (?:linear |actuated )?lift\b(?=\s*(?:[.,;:)]|$|(?:in|for|on)\b)))'
        unless: 'supersed|historical|earlier|previous|no longer|rev ?18\.[1-6]\b'
        message: the lift is approved in principle for 2.0 (P-03 rev18.9)
      - pattern: '(?P<found>\bfixed[- ]mast\b)'
        unless: 'supersed|historical|earlier|previous|legacy|replace|instead of|no longer|rev ?18\.[1-6]\b'
        message: the fixed mast is no longer the baseline; the lift is approved in principle (P-03 rev18.9)
      - pattern: '(?P<found>\blift\b[^\n]{0,40}\b(?:deferred|moved|postponed)\b[^\n]{0,25}\b3\.0\b|\blift\b[^\n]{0,15}\bin (?:OpenAMRobot )?3\.0\b|\blift (?:is |was )?removed\b|\blift\b[^\n]{0,40}\b(?:OpenAMRobot )?3\.0 scope\b|\b3\.0 lift\b)'
        unless: 'supersed|historical|earlier|previous|no longer|rev ?18\.[1-6]\b'
        message: the lift is not deferred to 3.0; it is approved in principle for 2.0 (P-03 rev18.9)
      - pattern: '(?P<found>\bHexalift V1\b|\bBS-HD240D350530\b|\bdold_v1_350\b)'
        unless: 'supersed|historical|earlier|previous|replac|legacy|rev ?18\.[1-7]\b'
        message: the lift is the DOLD Hexalift V4 350 mm, BS-HM240G350530-MFF24 (P-03 rev18.9 item 16)
      - pattern: '(?P<found>\bbp(?:100|150|200)\b|\bfive[- ](?:position|fore-aft|base[- ]plate)\b|\+100, \+150 and \+200)'
        unless: 'supersed|historical|earlier|previous|replac|no longer|rev ?18\.[1-8]\b'
        message: the lift base plate has two fore-aft positions, centre and +50 mm (P-03 rev18.9 item 18)
    verification:
      machine: text saying 2.0 has no lift, presenting a fixed mast as current, deferring the lift to 3.0, naming Hexalift V1 as current, or base-plate positions beyond +50 mm
      human: {reviewer: platform-lead, evidence: "P-03 rev18.9 items 16 and 18, the option B drawing set and the release-gate records: DOLD holding on E-stop and power loss, supplier CAD, weighed mass, CAN3 lift interface, F2S rerun"}
    owner: platform-lead

  - id: ARM-MOUNT
    title: Shoulder datum and arm mount on the lift (option B)
    summary: "Shoulder = height of openarm_{side}_base_link; arm mount 180 mm ahead of the column axis, y +/-31 mm."
    fix_hint: "Attach the arm base links to the lift carriage as listed; the upstream openarm_body_link0 is not used."
    kind: configuration
    status: recorded
    values:
      - shoulder height is the height above the floor of the OpenArm arm mount point, frame openarm_{side}_base_link (J1_A interface); joint1 and joint2 have no vertical offset from it
      - the upstream OpenArm body (openarm_body_link0, arm mounts at z 0.698 m) is not part of OpenAMRobot; the arm base links attach to the lift carriage
      - arm mount points at y +/-0.031 m, roll, pitch and yaw 0, one 1 mm spacer under each J1_A plate; shoulder spacing 307 mm
      - arm mount point 0.180 m ahead of the lift column axis and 0.166 m above the column top plate
      - arm profile MISUMI HFS6-60120 (60 mm lateral, 120 mm fore-aft), 340 mm, end-tapped, standing on a 10 mm adapter plate on the column top
      - column axis 330 mm behind the chassis front edge, x +0.060 at bp000 and x +0.110 at bp050 from base_link; chassis 780 x 582 mm; arm mount 150 mm behind the front edge (option B drawing sheet 2 rev A)
      - calibrated lift stops L1000, L1175 and L1350 (shoulder height in mm); the lift height is joint state
    unit: m
    date: 2026-10-12
    review_by: 2026-11-23
    source: {document: P-03-rev19.0, item: "item 19 (lift column position)"}
    supersedes:
      - {value: "fore-aft offset of the arm mount from the column axis 0 until CAD", source: P-03-rev18.8 item 17}
      - {value: "column axis at bp000 on the drive axle (x 0 from base_link), 330 mm behind the chassis front edge; bp050 is +0.050 m", source: P-03-rev18.9 items 17 and 18}
    applies_to: {repositories: ["openamr-*", "openamrobot-*"], files: ["**/*.md", "**/*.yaml", "**/*.yml", "**/*.html", "**/*.xacro", "**/*.urdf"]}
    check:
      - pattern: '(?P<found>(?:parent|attach\w*|mount\w*)[^\n]{0,40}\bopenarm_body_link0\b)'
        unless: 'not used|removed|upstream|no OpenArm body|supersed|historical'
        message: the upstream OpenArm body is not used; attach openarm_{side}_base_link to the lift carriage (P-03 rev18.9 item 17)
      - pattern: '(?P<found>\bcolumn axis\b[^\n]{0,40}?\bdrive axle\b|\bdrive axle\b[^\n]{0,40}?\bcolumn axis\b)'
        unless: 'supersed|historical'
        message: the column axis is 330 mm behind the front edge, x +0.060 at bp000 and +0.110 at bp050, not on the drive axle (P-03 rev19.0 item 19)
    verification:
      machine: text or a model that attaches the arms to the upstream openarm_body_link0; the column axis placed on the drive axle
      human: {reviewer: software-lead, evidence: "URDF frame tree: openarm_{side}_base_link under the lift carriage at x +0.180, y +/-0.031; shoulder z = 1.000 + lift q"}
    owner: platform-lead

  - id: CONFIG-IDS
